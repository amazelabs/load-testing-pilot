  TaskStatusChecker:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          import os, json, boto3
          ecs = boto3.client('ecs')
          s3 = boto3.client('s3')
          SCENARIOS_TABLE = os.environ['SCENARIOS_TABLE']
          SCENARIOS_BUCKET = os.environ.get('SCENARIOS_BUCKET', '')

          def handler(event, context):
              """Check if ECS load-test tasks are still running.
              Returns isRunning + passthrough of all input fields for Step Functions."""
              tc = event.get('testTaskConfig', {})
              test_id = event.get('testId', '')
              prefix = event.get('prefix', '')
              region = tc.get('region', os.environ.get('AWS_REGION', ''))
              cluster = tc.get('taskCluster', '')
              task_count = int(tc.get('taskCount', 1))

              print(f'[task-status-checker] testId={test_id} cluster={cluster} expected={task_count}')

              running = 0
              total = 0

              # Strategy 1: check S3 completion markers
              if SCENARIOS_BUCKET and prefix:
                  try:
                      resp = s3.list_objects_v2(
                          Bucket=SCENARIOS_BUCKET,
                          Prefix=f'results/{test_id}/{prefix}/completion/{region}/',
                      )
                      completed = resp.get('KeyCount', 0)
                      print(f'  Completion markers: {completed}/{task_count}')
                      if completed >= task_count:
                          result = {**event, 'isRunning': False, 'numTasksRunning': 0, 'numTasksTotal': task_count}
                          return result
                  except Exception as e:
                      print(f'  S3 check failed, falling back to ECS: {e}')

              # Strategy 2: check ECS task status
              if cluster:
                  try:
                      for status in ['RUNNING', 'PENDING', 'STOPPED']:
                          paginator = ecs.get_paginator('list_tasks')
                          for page in paginator.paginate(cluster=cluster, desiredStatus=status if status != 'STOPPED' else 'STOPPED'):
                              arns = page.get('taskArns', [])
                              if not arns:
                                  continue
                              desc = ecs.describe_tasks(cluster=cluster, tasks=arns)
                              for task in desc.get('tasks', []):
                                  envs = {}
                                  for co in task.get('overrides', {}).get('containerOverrides', []):
                                      for e in co.get('environment', []):
                                          envs[e.get('name')] = e.get('value')
                                  if envs.get('TEST_ID') != test_id:
                                      continue
                                  total += 1
                                  if task.get('lastStatus') == 'RUNNING':
                                      running += 1
                  except Exception as e:
                      print(f'  ECS check error: {e}')

              # running > 0 → tasks still executing
              # total == 0 AND tasks were already launched → still provisioning
              # total == 0 AND pre-flight check (no tasks launched yet) → NOT running
              # We distinguish via: if no tasks match our TEST_ID, the test isn't running.
              is_running = running > 0
              print(f'  running={running} total={total} is_running={is_running}')

              result = {
                  **event,
                  'isRunning': is_running,
                  'numTasksRunning': running,
                  'numTasksTotal': task_count,
              }
              return result
      Handler: index.handler
      Runtime: python3.12
      Timeout: 180
      Role: !GetAtt TaskStatusRole.Arn
      Environment:
        Variables:
          SCENARIOS_TABLE: !Ref ScenariosTable
          SCENARIOS_BUCKET: !Ref ScenariosBucket

