  TaskCanceler:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          import os, json, boto3
          ecs = boto3.client('ecs')
          ddb = boto3.resource('dynamodb')
          table = ddb.Table(os.environ['SCENARIOS_TABLE'])

          def handler(event, context):
              """Cancel a running load test: stop ECS tasks, update DynamoDB status."""
              test_id = event.get('testId', '')
              tc = event.get('testTaskConfig', {})
              if isinstance(tc, list):
                  tc = tc[0] if tc else {}
              cluster = tc.get('taskCluster', '')
              print(f'[task-canceler] testId={test_id} cluster={cluster}')

              # Stop all running tasks for this test
              stopped = 0
              if cluster:
                  try:
                      paginator = ecs.get_paginator('list_tasks')
                      for page in paginator.paginate(cluster=cluster, desiredStatus='RUNNING'):
                          task_arns = page.get('taskArns', [])
                          if not task_arns:
                              continue
                          desc = ecs.describe_tasks(cluster=cluster, tasks=task_arns)
                          for task in desc.get('tasks', []):
                              # Match by environment variable TEST_ID in container overrides or tags
                              envs = {}
                              for c in task.get('containers', []):
                                  for e in c.get('environment', []):
                                      envs[e.get('name')] = e.get('value')
                              # Also check overrides
                              for co in task.get('overrides', {}).get('containerOverrides', []):
                                  for e in co.get('environment', []):
                                      envs[e.get('name')] = e.get('value')
                              if envs.get('TEST_ID') == test_id:
                                  arn = task['taskArn']
                                  print(f'  Stopping task {arn}')
                                  try:
                                      ecs.stop_task(cluster=cluster, task=arn, reason='Cancelled by user')
                                      stopped += 1
                                  except Exception as e:
                                      print(f'  Warning: stop_task failed: {e}')
                  except Exception as e:
                      print(f'  Error listing tasks: {e}')

              # Update DynamoDB status
              try:
                  from datetime import datetime, timezone
                  table.update_item(
                      Key={'testId': test_id},
                      UpdateExpression='SET #s = :s, endTime = :t',
                      ExpressionAttributeNames={'#s': 'status'},
                      ExpressionAttributeValues={
                          ':s': 'cancelled',
                          ':t': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.000Z'),
                      },
                  )
              except Exception as e:
                  print(f'  Warning: DDB update failed: {e}')

              print(f'[task-canceler] done, stopped {stopped} tasks')
              return {'statusCode': 200}
      Handler: index.handler
      Runtime: python3.12
      Timeout: 300
      Role: !GetAtt TaskCancelerRole.Arn
      Environment:
        Variables:
          SCENARIOS_TABLE: !Ref ScenariosTable

