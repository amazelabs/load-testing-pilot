  AwsContext:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 512
      Role: !GetAtt AwsContextRole.Arn
      Environment:
        Variables:
          OWN_ROLE_ARN: !GetAtt AwsContextRole.Arn
      Code:
        ZipFile: |
          # Resolve a load-test target (hostname or IP) to AWS infrastructure and pull
          # CloudWatch metrics for the ELB / target group / backend instances during a
          # given time window. Returns a single JSON doc consumed by the frontend
          # 'AWS Resources & Metrics' card and later fed to the AI analysis endpoint.
          import json, os, re, ipaddress, socket
          from datetime import datetime, timezone, timedelta
          import boto3
          from botocore.exceptions import ClientError

          elbv2 = boto3.client('elbv2')
          ec2   = boto3.client('ec2')
          cw    = boto3.client('cloudwatch')

          def _resp(code, body):
              return {
                  'statusCode': code,
                  'headers': {
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Headers': 'Content-Type,X-Api-Key',
                      'Content-Type': 'application/json'
                  },
                  'body': json.dumps(body, default=str)
              }

          VALID_REGIONS = {'cn-north-1', 'cn-northwest-1'}

          def _make_clients(cred_config, region=None):
              rk = {}
              if region and region in VALID_REGIONS:
                  rk['region_name'] = region
              if not cred_config or not cred_config.get('mode'):
                  if rk:
                      s = boto3.Session(**rk)
                      return (s.client('elbv2'), s.client('ec2'), s.client('cloudwatch'))
                  return elbv2, ec2, cw
              mode = cred_config['mode']
              kw = {}
              if mode == 'aksk':
                  kw = dict(aws_access_key_id=cred_config['accessKeyId'],
                            aws_secret_access_key=cred_config['secretAccessKey'])
              elif mode == 'temp':
                  kw = dict(aws_access_key_id=cred_config['accessKeyId'],
                            aws_secret_access_key=cred_config['secretAccessKey'],
                            aws_session_token=cred_config['sessionToken'])
              elif mode == 'role':
                  sts = boto3.client('sts')
                  resp = sts.assume_role(RoleArn=cred_config['roleArn'],
                                         RoleSessionName='load-testing-pilot-cross-acct',
                                         DurationSeconds=900)
                  c = resp['Credentials']
                  kw = dict(aws_access_key_id=c['AccessKeyId'],
                            aws_secret_access_key=c['SecretAccessKey'],
                            aws_session_token=c['SessionToken'])
              else:
                  if rk:
                      s = boto3.Session(**rk)
                      return (s.client('elbv2'), s.client('ec2'), s.client('cloudwatch'))
                  return elbv2, ec2, cw
              kw.update(rk)
              s = boto3.Session(**kw)
              return (s.client('elbv2'), s.client('ec2'), s.client('cloudwatch'))

          def _is_ip(s):
              try:
                  ipaddress.ip_address(s)
                  return True
              except ValueError:
                  return False

          def _hostname_from_target(target):
              t = (target or '').strip()
              # Strip scheme + path + port
              t = re.sub(r'^\w+://', '', t)
              t = t.split('/', 1)[0]
              t = t.split(':', 1)[0]
              return t.lower()

          def find_elb_by_hostname(hostname):
              """Match ALB/NLB where DNSName equals / is a prefix of hostname, or where a custom domain CNAMEs to it."""
              target_dns = hostname
              # If user entered their own domain, resolve CNAME chain to find the *.elb.amazonaws.com.cn name
              try:
                  resolved = socket.gethostbyname_ex(hostname)  # (canonical, aliases, addresses)
                  canonical = resolved[0].lower()
                  if 'elb.amazonaws.com' in canonical:
                      target_dns = canonical
              except Exception:
                  pass

              lbs = []
              paginator = elbv2.get_paginator('describe_load_balancers')
              for page in paginator.paginate():
                  lbs.extend(page['LoadBalancers'])
              for lb in lbs:
                  dns = (lb.get('DNSName') or '').lower()
                  if dns == target_dns or target_dns.endswith('.' + dns):
                      return lb
              return None

          def list_target_groups_for_lb(lb_arn):
              tgs = []
              paginator = elbv2.get_paginator('describe_target_groups')
              for page in paginator.paginate(LoadBalancerArn=lb_arn):
                  tgs.extend(page['TargetGroups'])
              return tgs

          def list_target_health(tg_arn):
              resp = elbv2.describe_target_health(TargetGroupArn=tg_arn)
              return resp.get('TargetHealthDescriptions', [])

          def instance_ids_from_targets(targets, vpc_id):
              """Given target list (may be InstanceId or IP), return list of InstanceIds."""
              ids = set()
              ips = []
              for t in targets:
                  tid = t.get('Target', {}).get('Id', '')
                  if tid.startswith('i-'):
                      ids.add(tid)
                  elif _is_ip(tid):
                      ips.append(tid)
              if ips:
                  # Look up ENIs in the VPC that own these private IPs → find the attached instance
                  filters = [{'Name': 'addresses.private-ip-address', 'Values': ips}]
                  if vpc_id:
                      filters.append({'Name': 'vpc-id', 'Values': [vpc_id]})
                  try:
                      enis = ec2.describe_network_interfaces(Filters=filters).get('NetworkInterfaces', [])
                      for eni in enis:
                          att = eni.get('Attachment', {})
                          iid = att.get('InstanceId')
                          if iid: ids.add(iid)
                  except ClientError as e:
                      print(f"describe_network_interfaces failed: {e}")
              return sorted(ids)

          def describe_instances(ids):
              if not ids: return []
              out = []
              resp = ec2.describe_instances(InstanceIds=ids)
              for r in resp.get('Reservations', []):
                  for ins in r.get('Instances', []):
                      name = ''
                      for tag in ins.get('Tags', []):
                          if tag['Key'] == 'Name':
                              name = tag['Value']; break
                      # Collect attached EBS volume IDs
                      volumes = []
                      for bdm in ins.get('BlockDeviceMappings', []):
                          ebs = bdm.get('Ebs', {})
                          vid = ebs.get('VolumeId')
                          if vid:
                              volumes.append({'volumeId': vid, 'device': bdm.get('DeviceName', '')})
                      out.append({
                          'instanceId': ins['InstanceId'],
                          'name': name,
                          'instanceType': ins.get('InstanceType'),
                          'privateIp': ins.get('PrivateIpAddress'),
                          'state': ins.get('State', {}).get('Name'),
                          'az': ins.get('Placement', {}).get('AvailabilityZone'),
                          'volumes': volumes,
                      })
              return out

          # --- Metric catalog ---------------------------------------------------------
          ALB_METRICS = [
              ('RequestCount', 'Sum'),
              ('TargetResponseTime', 'Average'),
              ('HTTPCode_Target_2XX_Count', 'Sum'),
              ('HTTPCode_Target_4XX_Count', 'Sum'),
              ('HTTPCode_Target_5XX_Count', 'Sum'),
              ('HTTPCode_ELB_5XX_Count', 'Sum'),
              ('HTTPCode_ELB_4XX_Count', 'Sum'),
              ('ActiveConnectionCount', 'Average'),
              ('NewConnectionCount', 'Sum'),
              ('RejectedConnectionCount', 'Sum'),
              ('ConsumedLCUs', 'Sum'),
              ('TargetConnectionErrorCount', 'Sum'),
              ('ProcessedBytes', 'Sum'),
          ]
          NLB_METRICS = [
              ('ActiveFlowCount', 'Average'),
              ('NewFlowCount', 'Sum'),
              ('ProcessedBytes', 'Sum'),
              ('TCP_Target_Reset_Count', 'Sum'),
              ('TCP_ELB_Reset_Count', 'Sum'),
          ]
          CLB_METRICS = [
              ('RequestCount', 'Sum'),
              ('Latency', 'Average'),
              ('HTTPCode_Backend_2XX', 'Sum'),
              ('HTTPCode_Backend_4XX', 'Sum'),
              ('HTTPCode_Backend_5XX', 'Sum'),
              ('HTTPCode_ELB_5XX', 'Sum'),
              ('SurgeQueueLength', 'Maximum'),
              ('SpilloverCount', 'Sum'),
          ]
          EC2_METRICS = [
              ('CPUUtilization', 'Average'),
              ('NetworkIn', 'Sum'),
              ('NetworkOut', 'Sum'),
              ('NetworkPacketsIn', 'Sum'),
              ('NetworkPacketsOut', 'Sum'),
              ('DiskReadOps', 'Sum'),
              ('DiskWriteOps', 'Sum'),
              ('StatusCheckFailed', 'Maximum'),
              ('CPUCreditBalance', 'Minimum'),
          ]
          EBS_METRICS = [
              ('VolumeReadOps', 'Sum'),
              ('VolumeWriteOps', 'Sum'),
              ('VolumeQueueLength', 'Average'),
              ('VolumeReadBytes', 'Sum'),
              ('VolumeWriteBytes', 'Sum'),
              ('VolumeTotalReadTime', 'Average'),
              ('VolumeTotalWriteTime', 'Average'),
              ('BurstBalance', 'Minimum'),
          ]
          TG_METRICS = [
              ('HealthyHostCount', 'Minimum'),
              ('UnHealthyHostCount', 'Maximum'),
              ('RequestCountPerTarget', 'Sum'),
              ('TargetResponseTime', 'Average'),
          ]

          def pick_period(start, end):
              span = (end - start).total_seconds()
              if span <= 3600:    return 60
              if span <= 6*3600:  return 300
              if span <= 86400:   return 900
              return 3600

          def get_metrics(namespace, dimensions, metrics, start, end):
              """Pull multiple metrics in ONE GetMetricData call. Returns dict{metricName: {timestamps, values, stat, unit}}."""
              if not metrics: return {}
              period = pick_period(start, end)
              queries = []
              for idx, (name, stat) in enumerate(metrics):
                  queries.append({
                      'Id': f'm{idx}',
                      'MetricStat': {
                          'Metric': {
                              'Namespace': namespace,
                              'MetricName': name,
                              'Dimensions': dimensions,
                          },
                          'Period': period,
                          'Stat': stat,
                      },
                      'ReturnData': True,
                  })
              try:
                  resp = cw.get_metric_data(
                      MetricDataQueries=queries,
                      StartTime=start, EndTime=end,
                      ScanBy='TimestampAscending',
                  )
              except ClientError as e:
                  print(f"GetMetricData failed ns={namespace}: {e}")
                  return {}
              out = {}
              for i, (name, stat) in enumerate(metrics):
                  r = resp['MetricDataResults'][i]
                  tstamps = [t.isoformat() for t in r.get('Timestamps', [])]
                  values  = [float(v) for v in r.get('Values', [])]
                  out[name] = {
                      'stat': stat,
                      'period': period,
                      'timestamps': tstamps,
                      'values': values,
                      'sum': sum(values) if values else 0,
                      'max': max(values) if values else 0,
                      'min': min(values) if values else 0,
                      'avg': (sum(values)/len(values)) if values else 0,
                  }
              return out

          # Map LB type → namespace + metric set
          def lb_ns_and_metrics(lb):
              t = (lb.get('Type') or 'application').lower()
              if t == 'network':
                  return 'AWS/NetworkELB', NLB_METRICS
              if t == 'gateway':
                  return 'AWS/GatewayELB', []
              return 'AWS/ApplicationELB', ALB_METRICS

          def lb_dimension_value(lb):
              """CloudWatch LoadBalancer dim uses 'app/<name>/<id>' format (drop 'arn:...loadbalancer/')."""
              arn = lb['LoadBalancerArn']
              # e.g. arn:aws-cn:elasticloadbalancing:cn-north-1:xxx:loadbalancer/app/my-alb/abcd1234
              return arn.split(':loadbalancer/')[-1]

          def tg_dimension_value(tg_arn):
              # e.g. targetgroup/my-tg/xxxx
              return tg_arn.split(':')[-1]

          def handler(event, context):
              try:
                  # Support POST body (preferred) with GET query-string fallback
                  body = {}
                  raw = event.get('body')
                  if raw:
                      try: body = json.loads(raw)
                      except: pass
                  qp = event.get('queryStringParameters') or {}
                  target = (body.get('target') or qp.get('target', '')).strip()
                  st = body.get('startTime') or qp.get('startTime')
                  et = body.get('endTime') or qp.get('endTime')
                  cred_config = body.get('credentials')
                  region = body.get('region') or qp.get('region')
                  if region and region not in VALID_REGIONS:
                      return _resp(400, {'error': f'Invalid region: {region}'})
                  if not target:
                      return _resp(400, {'error': 'Missing target parameter'})
                  if not st or not et:
                      return _resp(400, {'error': 'Missing startTime/endTime'})
                  start = datetime.fromisoformat(st.replace('Z', '+00:00')).astimezone(timezone.utc)
                  end   = datetime.fromisoformat(et.replace('Z', '+00:00')).astimezone(timezone.utc)
                  start = start - timedelta(minutes=1)
                  end   = end + timedelta(minutes=1)

                  # Swap global clients if credentials or target region provided
                  global elbv2, ec2, cw
                  _orig = (elbv2, ec2, cw)
                  try:
                      elbv2, ec2, cw = _make_clients(cred_config, region)
                  except Exception as e:
                      return _resp(400, {'error': f'Credential error: {e}'})

                  host = _hostname_from_target(target)
                  direct_ip = _is_ip(host)

                  result = {
                      'target': target,
                      'host': host,
                      'isIp': direct_ip,
                      'window': { 'start': start.isoformat(), 'end': end.isoformat() },
                      'elb': None,
                      'targetGroups': [],
                      'instances': [],
                      'lambdaRoleArn': os.environ.get('OWN_ROLE_ARN', ''),
                  }

                  lb = None
                  if not direct_ip:
                      lb = find_elb_by_hostname(host)

                  if lb:
                      ns, lb_metrics = lb_ns_and_metrics(lb)
                      lb_dim_value = lb_dimension_value(lb)
                      lb_metric_data = get_metrics(
                          ns,
                          [{'Name': 'LoadBalancer', 'Value': lb_dim_value}],
                          lb_metrics, start, end,
                      )
                      result['elb'] = {
                          'arn': lb['LoadBalancerArn'],
                          'name': lb['LoadBalancerName'],
                          'type': lb.get('Type'),
                          'scheme': lb.get('Scheme'),
                          'dnsName': lb.get('DNSName'),
                          'vpcId': lb.get('VpcId'),
                          'azs': [z.get('ZoneName') for z in lb.get('AvailabilityZones', [])],
                          'metrics': lb_metric_data,
                      }
                      # Target groups
                      all_instance_ids = set()
                      tgs_info = []
                      for tg in list_target_groups_for_lb(lb['LoadBalancerArn']):
                          health = list_target_health(tg['TargetGroupArn'])
                          tg_dim_val = tg_dimension_value(tg['TargetGroupArn'])
                          tg_metric_data = get_metrics(
                              ns,
                              [
                                  {'Name': 'TargetGroup', 'Value': tg_dim_val},
                                  {'Name': 'LoadBalancer', 'Value': lb_dim_value},
                              ],
                              TG_METRICS, start, end,
                          )
                          ids = instance_ids_from_targets(health, lb.get('VpcId'))
                          all_instance_ids.update(ids)
                          tgs_info.append({
                              'arn': tg['TargetGroupArn'],
                              'name': tg['TargetGroupName'],
                              'protocol': tg.get('Protocol'),
                              'port': tg.get('Port'),
                              'targetType': tg.get('TargetType'),
                              'targets': [
                                  {
                                      'id': h['Target']['Id'],
                                      'port': h['Target'].get('Port'),
                                      'state': h['TargetHealth'].get('State'),
                                      'reason': h['TargetHealth'].get('Reason'),
                                      'description': h['TargetHealth'].get('Description'),
                                  }
                                  for h in health
                              ],
                              'resolvedInstanceIds': ids,
                              'metrics': tg_metric_data,
                          })
                      result['targetGroups'] = tgs_info
                      instances = describe_instances(list(all_instance_ids))
                      for inst in instances:
                          inst['metrics'] = get_metrics(
                              'AWS/EC2',
                              [{'Name': 'InstanceId', 'Value': inst['instanceId']}],
                              EC2_METRICS, start, end,
                          )
                          # EBS metrics per volume
                          inst['ebsMetrics'] = {}
                          for vol in inst.get('volumes', []):
                              vol_metrics = get_metrics(
                                  'AWS/EBS',
                                  [{'Name': 'VolumeId', 'Value': vol['volumeId']}],
                                  EBS_METRICS, start, end,
                              )
                              inst['ebsMetrics'][vol['volumeId']] = vol_metrics
                      result['instances'] = instances
                  elif direct_ip:
                      # IP direct target: try to find an ENI with this IP and resolve the instance
                      try:
                          enis = ec2.describe_network_interfaces(
                              Filters=[{'Name': 'addresses.private-ip-address', 'Values': [host]}]
                          ).get('NetworkInterfaces', [])
                          iids = set()
                          for eni in enis:
                              att = eni.get('Attachment', {})
                              if att.get('InstanceId'): iids.add(att['InstanceId'])
                          instances = describe_instances(list(iids))
                          for inst in instances:
                              inst['metrics'] = get_metrics(
                                  'AWS/EC2',
                                  [{'Name': 'InstanceId', 'Value': inst['instanceId']}],
                                  EC2_METRICS, start, end,
                              )
                              inst['ebsMetrics'] = {}
                              for vol in inst.get('volumes', []):
                                  vol_metrics = get_metrics(
                                      'AWS/EBS',
                                      [{'Name': 'VolumeId', 'Value': vol['volumeId']}],
                                      EBS_METRICS, start, end,
                                  )
                                  inst['ebsMetrics'][vol['volumeId']] = vol_metrics
                          result['instances'] = instances
                      except ClientError as e:
                          print(f"IP lookup failed: {e}")

                  elbv2, ec2, cw = _orig
                  return _resp(200, result)
              except Exception as e:
                  elbv2, ec2, cw = _orig
                  print(f"AwsContext error: {e}")
                  import traceback; traceback.print_exc()
                  return _resp(500, {'error': str(e)})

  # =============================================================================
  # AiProxy Lambda — forwards chat completions to an OpenAI-compatible endpoint
  # The frontend stores API key/base URL in localStorage and sends per-request.
  # =============================================================================
  AiProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: inline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"

  AiProxy:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 900
      MemorySize: 256
      Role: !GetAtt AiProxyRole.Arn
      Code:
        ZipFile: |
          // Node.js proxy to an OpenAI-compatible /chat/completions endpoint.
          // - When invoked via API Gateway (sync, 29s max), returns a one-shot JSON response.
          // - When invoked via Lambda Function URL with RESPONSE_STREAM, streams deltas back
          //   to the browser so the UI can render token-by-token within the 15-minute budget.
          // The frontend passes baseUrl / apiKey / model / messages per request.

          'use strict';

          const STATIC_CORS = {
            'Access-Control-Allow-Origin': '*',
            'Access-Control-Allow-Methods': 'POST,OPTIONS',
            'Access-Control-Allow-Headers': 'Content-Type,Authorization,X-Api-Key',
          };

          function buildUrl(baseUrl) {
              let u = (baseUrl || '').replace(/\/+$/, '');
              if (u.endsWith('/chat/completions')) return u;
              if (u.endsWith('/v1')) return u + '/chat/completions';
              return u + '/v1/chat/completions';
          }

          function validate(body) {
              const base = (body.baseUrl || '').trim();
              const key = (body.apiKey || '').trim();
              const model = (body.model || '').trim();
              const msgs = body.messages || [];
              if (!base || !key || !model || !msgs.length) {
                  return 'baseUrl / apiKey / model / messages required';
              }
              return null;
          }

          // ===== Non-streaming handler (API Gateway / direct invoke) =====
          async function nonStreaming(event) {
              const raw = event.body || '{}';
              let body;
              try { body = JSON.parse(raw); } catch {
                  return { statusCode: 400, headers: { 'Content-Type': 'application/json', ...STATIC_CORS },
                           body: JSON.stringify({ error: 'invalid json' }) };
              }
              const err = validate(body);
              if (err) return { statusCode: 400, headers: { 'Content-Type':'application/json', ...STATIC_CORS }, body: JSON.stringify({ error: err }) };

              const url = buildUrl(body.baseUrl);
              let upstream;
              try {
                  upstream = await fetch(url, {
                      method: 'POST',
                      headers: {
                          'Content-Type': 'application/json',
                          'Authorization': `Bearer ${body.apiKey}`,
                      },
                      body: JSON.stringify({
                          model: body.model,
                          messages: body.messages,
                          temperature: body.temperature ?? 0.2,
                          stream: false,
                      }),
                  });
              } catch (e) {
                  return { statusCode: 502, headers: { 'Content-Type':'application/json', ...STATIC_CORS },
                           body: JSON.stringify({ error: `upstream unreachable: ${e.message}` }) };
              }
              const text = await upstream.text();
              if (!upstream.ok) {
                  return { statusCode: upstream.status, headers: { 'Content-Type':'application/json', ...STATIC_CORS },
                           body: JSON.stringify({ error: `upstream ${upstream.status}`, detail: text.slice(0, 4000) }) };
              }
              let data;
              try { data = JSON.parse(text); } catch {
                  return { statusCode: 502, headers: { 'Content-Type':'application/json', ...STATIC_CORS },
                           body: JSON.stringify({ error: 'non-json response', raw: text.slice(0, 2000) }) };
              }
              const content = data.choices?.[0]?.message?.content || '';
              return {
                  statusCode: 200,
                  headers: { 'Content-Type':'application/json', ...STATIC_CORS },
                  body: JSON.stringify({ content, model: data.model || body.model, usage: data.usage || {} }),
              };
          }

          exports.handler = nonStreaming;

  # AiProxy is invoked as a synchronous fallback via API Gateway. Modern LLM
  # endpoints (DeepSeek / DashScope / OpenAI / Moonshot) support CORS so the
  # browser can call them directly and stream tokens without any server-side
  # proxy at all. We only keep this for providers that don't set CORS headers.

  # =============================================================================
  # UploadUrl Lambda — generates S3 presigned PUT URLs for script file uploads
  # =============================================================================
  UploadUrlRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: inline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub "${ScenariosBucket.Arn}/test-scenarios/*"
                  - !Sub "${ScenariosBucket.Arn}/public/test-scenarios/*"

  UploadUrl:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt UploadUrlRole.Arn
      Environment:
        Variables:
          SCENARIOS_BUCKET: !Ref ScenariosBucket
      Code:
        ZipFile: |
          import json, os, re
          import boto3

          s3 = boto3.client('s3')
          BUCKET = os.environ['SCENARIOS_BUCKET']
          ALLOWED_EXT = {'.jmx', '.js', '.py', '.zip', '.yml', '.yaml'}
          CORS = {
              'Access-Control-Allow-Origin': '*',
              'Access-Control-Allow-Methods': 'GET,OPTIONS',
              'Access-Control-Allow-Headers': 'Content-Type,X-Api-Key',
          }

          def handler(event, context):
              params = event.get('queryStringParameters') or {}
              test_id = (params.get('testId') or '').strip()
              file_ext = (params.get('fileExt') or '').strip().lower()
              test_type = (params.get('testType') or '').strip().lower()
              action = (params.get('action') or '').strip().lower()
              if not file_ext.startswith('.'):
                  file_ext = '.' + file_ext

              if not test_id or not re.match(r'^[a-zA-Z0-9-]+$', test_id):
                  return {'statusCode': 400, 'headers': CORS,
                          'body': json.dumps({'error': 'invalid testId'})}
              if file_ext not in ALLOWED_EXT:
                  return {'statusCode': 400, 'headers': CORS,
                          'body': json.dumps({'error': f'unsupported extension: {file_ext}'})}

              # Path must match container download: public/test-scenarios/{type}/{id}.{ext}
              if test_type in ('jmeter', 'k6', 'locust'):
                  key = f'public/test-scenarios/{test_type}/{test_id}{file_ext}'
              else:
                  key = f'public/test-scenarios/script/{test_id}{file_ext}'

              if action == 'download':
                  url = s3.generate_presigned_url(
                      'get_object',
                      Params={'Bucket': BUCKET, 'Key': key},
                      ExpiresIn=3600,
                  )
                  return {
                      'statusCode': 200,
                      'headers': {**CORS, 'Content-Type': 'application/json'},
                      'body': json.dumps({'downloadUrl': url, 'key': key}),
                  }

              url = s3.generate_presigned_url(
                  'put_object',
                  Params={'Bucket': BUCKET, 'Key': key},
                  ExpiresIn=300,
                  HttpMethod='PUT',
              )
              return {
                  'statusCode': 200,
                  'headers': {**CORS, 'Content-Type': 'application/json'},
                  'body': json.dumps({'uploadUrl': url, 'key': key}),
              }

  # =============================================================================
  # Step Functions State Machine
  # =============================================================================
  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: !Sub "states.${AWS::Region}.amazonaws.com" }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: inline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt TaskRunner.Arn
                  - !GetAtt TaskStatusChecker.Arn
                  - !GetAtt TaskCanceler.Arn
                  - !GetAtt ResultsParser.Arn
                  - !GetAtt MetricFilterCleaner.Arn

  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionString: !Sub |
        {
          "StartAt": "Regions for testing",
          "States": {
            "Regions for testing": {
              "Type": "Map",
              "ResultPath": null,
              "Next": "Parse result",
              "InputPath": "$",
              "ItemsPath": "$.testTaskConfig",
              "ItemSelector": {
                "testTaskConfig.$": "$$.Map.Item.Value",
                "testId.$": "$.testId",
                "testType.$": "$.testType",
                "fileType.$": "$.fileType",
                "showLive.$": "$.showLive",
                "testDuration.$": "$.testDuration",
                "prefix.$": "$.prefix",
                "testRunId.$": "$.testRunId"
              },
              "ItemProcessor": {
                "ProcessorConfig": { "Mode": "INLINE" },
                "StartAt": "Check running tests",
                "States": {
                  "Check running tests": {
                    "Type": "Task",
                    "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                    "InputPath": "$",
                    "OutputPath": "$.Payload",
                    "Parameters": {
                      "FunctionName": "${TaskStatusChecker.Arn}",
                      "Payload.$": "$"
                    },
                    "Retry": [{
                      "ErrorEquals": ["Lambda.ClientExecutionTimeoutException","Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                      "IntervalSeconds": 2, "MaxAttempts": 6, "BackoffRate": 2
                    }],
                    "Next": "No running tests"
                  },
                  "No running tests": {
                    "Type": "Choice",
                    "Choices": [{ "Variable": "$.isRunning", "BooleanEquals": false, "Next": "Run workers" }],
                    "Default": "Test is still running"
                  },
                  "Test is still running": {
                    "Type": "Fail",
                    "Error": "TestAlreadyRunning",
                    "Cause": "The same test is already running."
                  },
                  "Run workers": {
                    "Type": "Task",
                    "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                    "InputPath": "$",
                    "OutputPath": "$.Payload",
                    "Parameters": {
                      "FunctionName": "${TaskRunner.Arn}",
                      "Payload.$": "$"
                    },
                    "Retry": [{
                      "ErrorEquals": ["Lambda.ClientExecutionTimeoutException","Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                      "IntervalSeconds": 2, "MaxAttempts": 6, "BackoffRate": 2
                    }],
                    "Next": "Requires leader?"
                  },
                  "Requires leader?": {
                    "Type": "Choice",
                    "Choices": [
                      { "Variable": "$.isRunning", "BooleanEquals": false, "Next": "Cancel Test" },
                      { "Variable": "$.taskIds", "IsPresent": false, "Next": "Wait specified test duration" }
                    ],
                    "Default": "Wait 1 minute - worker status"
                  },
                  "Wait 1 minute - worker status": {
                    "Type": "Wait",
                    "Seconds": 60,
                    "Next": "Check worker status"
                  },
                  "Check worker status": {
                    "Type": "Task",
                    "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                    "InputPath": "$",
                    "OutputPath": "$.Payload",
                    "Parameters": {
                      "FunctionName": "${TaskStatusChecker.Arn}",
                      "Payload.$": "$"
                    },
                    "Retry": [{
                      "ErrorEquals": ["Lambda.ClientExecutionTimeoutException","Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                      "IntervalSeconds": 2, "MaxAttempts": 6, "BackoffRate": 2
                    }],
                    "Next": "Are all workers running?"
                  },
                  "Are all workers running?": {
                    "Type": "Choice",
                    "Choices": [
                      { "Variable": "$.isRunning", "BooleanEquals": false, "Next": "Cancel Test" },
                      { "Variable": "$.numTasksRunning", "NumericEqualsPath": "$.numTasksTotal", "Next": "Run leader task" }
                    ],
                    "Default": "Wait 1 minute - worker status"
                  },
                  "Cancel Test": {
                    "Type": "Task",
                    "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                    "InputPath": "$",
                    "ResultPath": null,
                    "Parameters": {
                      "FunctionName": "${TaskCanceler.Arn}",
                      "Payload.$": "$"
                    },
                    "Retry": [{
                      "ErrorEquals": ["Lambda.ClientExecutionTimeoutException","Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                      "IntervalSeconds": 2, "MaxAttempts": 6, "BackoffRate": 2
                    }],
                    "Next": "Map End"
                  },
                  "Run leader task": {
                    "Type": "Task",
                    "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                    "InputPath": "$",
                    "OutputPath": "$.Payload",
                    "Parameters": {
                      "FunctionName": "${TaskRunner.Arn}",
                      "Payload.$": "$"
                    },
                    "Retry": [{
                      "ErrorEquals": ["Lambda.ClientExecutionTimeoutException","Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                      "IntervalSeconds": 2, "MaxAttempts": 6, "BackoffRate": 2
                    }],
                    "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "Cancel Test" }],
                    "Next": "Wait specified test duration"
                  },
                  "Wait specified test duration": {
                    "Type": "Wait",
                    "SecondsPath": "$.testDuration",
                    "Next": "Check task status"
                  },
                  "Check task status": {
                    "Type": "Task",
                    "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                    "InputPath": "$",
                    "OutputPath": "$.Payload",
                    "Parameters": {
                      "FunctionName": "${TaskStatusChecker.Arn}",
                      "Payload.$": "$"
                    },
                    "Retry": [{
                      "ErrorEquals": ["Lambda.ClientExecutionTimeoutException","Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                      "IntervalSeconds": 2, "MaxAttempts": 6, "BackoffRate": 2
                    }],
                    "Next": "Are all tasks done?"
                  },
                  "Wait 1 minute - task status": {
                    "Type": "Wait",
                    "Seconds": 60,
                    "Next": "Check task status"
                  },
                  "Are all tasks done?": {
                    "Type": "Choice",
                    "Choices": [{ "Variable": "$.isRunning", "BooleanEquals": false, "Next": "Map End" }],
                    "Default": "Wait 1 minute - task status"
                  },
                  "Map End": { "Type": "Pass", "End": true }
                }
              }
            },
            "Parse result": {
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
              "ResultPath": "$.parseResult",
              "Parameters": {
                "FunctionName": "${ResultsParser.Arn}",
                "Payload": {
                  "testTaskConfig.$": "$.testTaskConfig",
                  "testId.$": "$.testId",
                  "testType.$": "$.testType",
                  "fileType.$": "$.fileType",
                  "showLive.$": "$.showLive",
                  "testDuration.$": "$.testDuration",
                  "prefix.$": "$.prefix",
                  "testRunId.$": "$.testRunId",
                  "executionStart.$": "$$.Execution.StartTime"
                }
              },
              "Retry": [{
                "ErrorEquals": ["Lambda.ClientExecutionTimeoutException","Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                "IntervalSeconds": 2, "MaxAttempts": 6, "BackoffRate": 2
              }],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "Cleanup Metric Filters" }],
              "Next": "Cleanup Metric Filters"
            },
            "Cleanup Metric Filters": {
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
              "ResultPath": null,
              "Parameters": {
                "FunctionName": "${MetricFilterCleaner.Arn}",
                "Payload": {
                  "testTaskConfig.$": "$.testTaskConfig",
                  "testId.$": "$.testId"
                }
              },
              "Retry": [{
                "ErrorEquals": ["Lambda.ClientExecutionTimeoutException","Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                "IntervalSeconds": 2, "MaxAttempts": 6, "BackoffRate": 2
              }],
              "Next": "Done"
            },
            "Done": { "Type": "Succeed" }
          }
        }

  # =============================================================================
  # API Services Lambda
  # =============================================================================
  ApiServicesRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: inline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt ScenariosTable.Arn
                  - !GetAtt HistoryTable.Arn
                  - !Sub "${HistoryTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ScenariosBucket.Arn
                  - !Sub "${ScenariosBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - ecs:ListTasks
                  - ecs:ListClusters
                  - ecs:DescribeTasks
                  - ecs:DescribeClusters
                  - ecs:DescribeTaskDefinition
                  - ecs:StopTask
                  - ecs:ListAccountSettings
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:DeleteMetricFilter
                  - logs:DescribeMetricFilters
                Resource: "*"
              - Effect: Allow
                Action: cloudwatch:DeleteDashboards
                Resource: !Sub "arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/EcsLoadTesting*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals: { "cloudwatch:namespace": "distributed-load-testing" }
              - Effect: Allow
                Action: servicequotas:GetServiceQuota
                Resource: "*"
              - Effect: Allow
                Action:
                  - states:StartExecution
                  - states:StopExecution
                  - states:DescribeExecution
                Resource: !Ref StateMachine
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt TaskCanceler.Arn
  ApiServices:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          import os, json, uuid, boto3
          from datetime import datetime, timezone
          from decimal import Decimal

          BUCKET   = os.environ['SCENARIOS_BUCKET']
          TBL_NAME = os.environ['SCENARIOS_TABLE']
          HIS_NAME = os.environ['HISTORY_TABLE']
          SFN_ARN  = os.environ['STATE_MACHINE_ARN']
          CAN_ARN  = os.environ['TASK_CANCELER_ARN']
          REGION   = os.environ.get('AWS_REGION', 'cn-north-1')

          ddb  = boto3.resource('dynamodb')
          tbl  = ddb.Table(TBL_NAME)
          hist = ddb.Table(HIS_NAME)
          s3   = boto3.client('s3')
          sfn  = boto3.client('stepfunctions')
          lam  = boto3.client('lambda')
          ecs  = boto3.client('ecs')

          class DE(json.JSONEncoder):
              """Handle DynamoDB Decimal in JSON."""
              def default(self, o):
                  if isinstance(o, Decimal):
                      return int(o) if o == int(o) else float(o)
                  return super().default(o)

          def _to_ddb(x):
              if isinstance(x, dict): return {k: _to_ddb(v) for k, v in x.items()}
              if isinstance(x, list): return [_to_ddb(v) for v in x]
              if isinstance(x, float): return Decimal(str(round(x, 6)))
              if isinstance(x, int) and not isinstance(x, bool): return Decimal(x)
              return x

          def R(code, body):
              return {
                  'statusCode': code,
                  'headers': {
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Headers': 'Origin,X-Requested-With,Content-Type,Accept,X-Api-Key',
                  },
                  'body': json.dumps(body, cls=DE, default=str),
              }

          def now_s():
              return datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')

          def dur(s):
              """Parse '60s' or '5m' to seconds."""
              if not s: return 0
              s = str(s).strip()
              if s.endswith('m'): return int(s[:-1]) * 60
              if s.endswith('s'): return int(s[:-1])
              try: return int(s)
              except: return 0

          # ── Router ──────────────────────────────────────────────────────
          def handler(event, context):
              res = event.get('resource', '')
              met = event.get('httpMethod', '')
              pp  = event.get('pathParameters') or {}
              body = {}
              if event.get('body'):
                  try: body = json.loads(event['body'])
                  except: return R(400, 'Invalid JSON')
              try:
                  if res == '/scenarios':
                      if met == 'GET':    return R(200, list_tests())
                      if met == 'POST':   return R(200, create_test(body))
                  elif res == '/scenarios/{testId}':
                      tid = pp.get('testId', '')
                      if met == 'GET':    return R(200, get_test(tid))
                      if met == 'POST':   return R(200, cancel_test(tid))
                      if met == 'DELETE': return R(200, delete_test(tid))
                      if met == 'PUT':    return R(200, update_scenario(tid, body))
                  elif res == '/stack-info':
                      return R(200, {
                          'region': REGION,
                          'stack_name': os.environ.get('STACK_NAME', ''),
                          'api_endpoint': os.environ.get('API_ENDPOINT', ''),
                          'ecs_cluster': os.environ.get('ECS_CLUSTER', ''),
                          'state_machine_arn': SFN_ARN,
                          'scenarios_bucket': BUCKET,
                          'console_bucket': os.environ.get('CONSOLE_BUCKET', ''),
                          'scenarios_table': TBL_NAME,
                          'history_table': HIS_NAME,
                      })
                  return R(200, {})
              except Exception as e:
                  print(f'ERROR: {e}')
                  return R(400, str(e))

          # ── GET /scenarios ──────────────────────────────────────────────
          def list_tests():
              items = []
              params = {
                  'ProjectionExpression': 'testId, testName, testDescription, #s, startTime',
                  'ExpressionAttributeNames': {'#s': 'status'},
                  'FilterExpression': 'NOT begins_with(testId, :p)',
                  'ExpressionAttributeValues': {':p': 'region'},
              }
              r = tbl.scan(**params)
              items.extend(r.get('Items', []))
              while 'LastEvaluatedKey' in r:
                  params['ExclusiveStartKey'] = r['LastEvaluatedKey']
                  r = tbl.scan(**params)
                  items.extend(r.get('Items', []))
              items.sort(key=lambda x: x.get('startTime', ''), reverse=True)
              return {'Items': items}

          # ── POST /scenarios ─────────────────────────────────────────────
          def create_test(cfg):
              tid   = cfg.get('testId') or uuid.uuid4().hex[:10]
              tname = cfg.get('testName', '')
              tdesc = cfg.get('testDescription', '')
              ttype = cfg.get('testType', 'simple')
              ftype = 'none' if ttype == 'simple' else cfg.get('fileType', 'script')
              show  = cfg.get('showLive', False)
              tcs   = cfg.get('testTaskConfigs', [])
              ts    = cfg.get('testScenario', {})

              # Reporting section consumed by Taurus
              ts['reporting'] = [{
                  'module': 'final-stats', 'summary': True,
                  'percentiles': True, 'summary-labels': True,
                  'test-duration': True, 'dump-xml': '/tmp/artifacts/results.xml',
              }]

              # For script types, set the script reference so bzt/Taurus knows which file to run.
              # Container downloads the file to CWD as {testId}.{ext}; scenario must reference it.
              if ttype != 'simple':
                  ext_map = {'jmeter': '.jmx', 'k6': '.js', 'locust': '.py'}
                  ext = ext_map.get(ttype, '.jmx')
                  scenario_name = ts.get('execution', [{}])[0].get('scenario', 'scenario1')
                  if scenario_name not in ts.get('scenarios', {}):
                      ts.setdefault('scenarios', {})[scenario_name] = {}
                  ts['scenarios'][scenario_name]['script'] = f'{tid}{ext}'

              exe = ts.get('execution', [{}])[0]
              td  = dur(exe.get('hold-for', '0')) + dur(exe.get('ramp-up', '0'))

              # Write scenario JSON to S3 per region
              for tc in tcs:
                  sc = dict(ts)
                  sc['execution'] = [dict(exe,
                      taskCount=tc.get('taskCount', 1),
                      concurrency=tc.get('concurrency', 1))]
                  s3.put_object(Bucket=BUCKET,
                      Key=f'test-scenarios/{tid}-{tc["region"]}.json',
                      Body=json.dumps(sc, cls=DE, default=str))

              # Merge test + infra config for Step Functions
              merged = []
              for tc in tcs:
                  infra = tbl.get_item(Key={'testId': f'region-{tc["region"]}'}).get('Item', {})
                  merged.append({**tc, **infra})

              # Start Step Functions execution
              rid = uuid.uuid4().hex[:10]
              ts_iso = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H-%M-%S')
              pfx = f'{ts_iso}_{rid}'
              sfn_input = {
                  'testTaskConfig': merged, 'testId': tid, 'testType': ttype,
                  'fileType': ftype, 'showLive': show, 'testDuration': td,
                  'prefix': pfx, 'testRunId': rid,
              }
              sfn.start_execution(
                  stateMachineArn=SFN_ARN,
                  name=f'scenario-{tid}-run-{rid}',
                  input=json.dumps(sfn_input, cls=DE, default=str))

              # Write to DynamoDB
              st = now_s()
              tbl.update_item(
                  Key={'testId': tid},
                  UpdateExpression='SET #n=:n,#d=:d,#tc=:tc,#ts=:ts,#s=:s,#r=:r,#st=:st,#et=:et,#sl=:sl,#tt=:tt,#ft=:ft,#rid=:rid',
                  ExpressionAttributeNames={
                      '#n':'testName','#d':'testDescription','#tc':'testTaskConfigs',
                      '#ts':'testScenario','#s':'status','#r':'results',
                      '#st':'startTime','#et':'endTime','#sl':'showLive',
                      '#tt':'testType','#ft':'fileType','#rid':'testRunId'},
                  ExpressionAttributeValues={
                      ':n':tname,':d':tdesc,':tc':tcs,
                      ':ts':json.dumps(ts, cls=DE, default=str),
                      ':s':'running',':r':{},':st':st,':et':'',
                      ':sl':show,':tt':ttype,':ft':ftype,':rid':rid})
              return {'testId':tid,'testName':tname,'testDescription':tdesc,
                      'testType':ttype,'status':'running','startTime':st}

          # ── GET /scenarios/{testId} ─────────────────────────────────────
          def get_test(tid):
              item = tbl.get_item(Key={'testId': tid}).get('Item')
              if not item:
                  raise Exception(f"TEST_NOT_FOUND: '{tid}' not found")
              # Parse testScenario JSON string
              if isinstance(item.get('testScenario'), str):
                  try: item['testScenario'] = json.loads(item['testScenario'])
                  except: pass
              # Merge infra config into testTaskConfigs
              for tc in (item.get('testTaskConfigs') or []):
                  infra = tbl.get_item(Key={'testId': f'region-{tc["region"]}'}).get('Item', {})
                  tc.update(infra)
              # Query history table
              hi = []
              qp = {'KeyConditionExpression': 'testId = :t',
                     'ExpressionAttributeValues': {':t': tid}}
              r = hist.query(**qp)
              hi.extend(r.get('Items', []))
              while 'LastEvaluatedKey' in r:
                  qp['ExclusiveStartKey'] = r['LastEvaluatedKey']
                  r = hist.query(**qp)
                  hi.extend(r.get('Items', []))
              item['history'] = hi
              # ECS task info when test is active
              if item.get('status') in ('running', 'cancelling', 'provisioning'):
                  item['tasksPerRegion'] = _ecs_tasks(item, tid)
              return item

          def _ecs_tasks(item, tid):
              """List ECS tasks (RUNNING + STOPPED) matching this testId and testRunId."""
              out = []
              for tc in (item.get('testTaskConfigs') or []):
                  cl  = tc.get('taskCluster', '')
                  reg = tc.get('region', REGION)
                  tasks = []
                  if cl:
                      try:
                          arns = []
                          pg = ecs.get_paginator('list_tasks')
                          for status in ('RUNNING', 'STOPPED'):
                              for page in pg.paginate(cluster=cl, desiredStatus=status):
                                  arns.extend(page.get('taskArns', []))
                          for i in range(0, len(arns), 100):
                              desc = ecs.describe_tasks(cluster=cl, tasks=arns[i:i+100])
                              for t in desc.get('tasks', []):
                                  envs = {}
                                  for co in t.get('overrides',{}).get('containerOverrides',[]):
                                      for e in co.get('environment',[]):
                                          envs[e.get('name')] = e.get('value')
                                  if envs.get('TEST_ID') != tid:
                                      continue
                                  # Skip tasks from previous runs by matching TEST_RUN_ID
                                  current_run_id = item.get('testRunId', '')
                                  task_run_id = envs.get('TEST_RUN_ID', '')
                                  if current_run_id and task_run_id and task_run_id != current_run_id:
                                      continue
                                  sa = t.get('startedAt','')
                                  if hasattr(sa, 'isoformat'): sa = sa.isoformat()
                                  tasks.append({
                                      'lastStatus': t.get('lastStatus',''),
                                      'startedAt': sa,
                                      'containers': [{'lastStatus':c.get('lastStatus','')}
                                                     for c in t.get('containers',[])]})
                      except Exception as e:
                          print(f'  ECS list error {reg}: {e}')
                  out.append({'region': reg, 'tasks': tasks})
              return out

          # ── POST /scenarios/{testId} (cancel) ──────────────────────────
          def cancel_test(tid):
              item = tbl.get_item(Key={'testId': tid}).get('Item', {})
              tcs = list(item.get('testTaskConfigs') or [])
              for tc in tcs:
                  infra = tbl.get_item(Key={'testId': f'region-{tc["region"]}'}).get('Item', {})
                  tc.update(infra)
              tbl.update_item(
                  Key={'testId': tid},
                  UpdateExpression='SET #s = :s',
                  ExpressionAttributeNames={'#s': 'status'},
                  ExpressionAttributeValues={':s': 'cancelling'})
              lam.invoke(
                  FunctionName=CAN_ARN, InvocationType='Event',
                  Payload=json.dumps({'testId': tid, 'testTaskConfig': tcs},
                                     cls=DE, default=str))
              return 'cancelling'

          # ── DELETE /scenarios/{testId} ──────────────────────────────────
          def delete_test(tid):
              item = tbl.get_item(Key={'testId': tid}).get('Item', {})
              st = item.get('status', '')
              if st and st not in ('complete', 'cancelled', 'failed'):
                  raise Exception(f"TEST_RUNNING: '{tid}' is currently {st}")
              # Delete scenario entry
              tbl.delete_item(Key={'testId': tid})
              # Delete history entries
              hi = []
              qp = {'KeyConditionExpression': 'testId = :t',
                     'ExpressionAttributeValues': {':t': tid},
                     'ProjectionExpression': 'testId, testRunId'}
              r = hist.query(**qp)
              hi.extend(r.get('Items', []))
              while 'LastEvaluatedKey' in r:
                  qp['ExclusiveStartKey'] = r['LastEvaluatedKey']
                  r = hist.query(**qp)
                  hi.extend(r.get('Items', []))
              with hist.batch_writer() as bw:
                  for h in hi:
                      bw.delete_item(Key={'testId': h['testId'], 'testRunId': h['testRunId']})
              # Delete S3 test-scenario files
              try:
                  r = s3.list_objects_v2(Bucket=BUCKET, Prefix=f'test-scenarios/{tid}')
                  for o in r.get('Contents', []):
                      s3.delete_object(Bucket=BUCKET, Key=o['Key'])
              except: pass
              return 'success'

          ALLOWED_PUT_FIELDS = {'awsContext', 'aiAnalysis', 'testPrompt'}

          def update_scenario(tid, body):
              fields = {k: v for k, v in body.items() if k in ALLOWED_PUT_FIELDS}
              if not fields:
                  raise Exception('No valid fields to update')
              expr_parts = []
              names = {}
              vals = {}
              for i, (k, v) in enumerate(fields.items()):
                  alias = f'#f{i}'
                  val_alias = f':v{i}'
                  names[alias] = k
                  vals[val_alias] = _to_ddb(v)
                  expr_parts.append(f'{alias} = {val_alias}')
              tbl.update_item(
                  Key={'testId': tid},
                  UpdateExpression='SET ' + ', '.join(expr_parts),
                  ExpressionAttributeNames=names,
                  ExpressionAttributeValues=vals)
              return 'success'

