  # ---------- Deployment ----------
  # NOTE: Bump the Description below whenever you add/remove a Method or Resource
  # under this API. Otherwise CFN won't create a new deployment and new routes
  # will return 403 "Missing Authentication Token".
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ScenariosAny
      - ScenariosOptions
      - ScenariosTestIdAny
      - ScenariosTestIdOptions
      - TestRunsAny
      - TestRunsOptions
      - TestRunIdAny
      - TestRunIdOptions
      - BaselineAny
      - BaselineOptions
      - TasksAny
      - TasksOptions
      - RegionsAny
      - RegionsOptions
      - VcpuAny
      - VcpuOptions
      - StackInfoAny
      - StackInfoOptions
      - AwsContextPost
      - AwsContextOptions
      - AiAnalyzePost
      - AiAnalyzeOptions
      - UploadUrlGet
      - UploadUrlOptions
    Properties:
      RestApiId: !Ref RestApi
      Description: "rev-2026-05-25-api-key-auth"

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod

  # ---------- API Key authentication ----------
  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      UsagePlanName: !Sub "${AWS::StackName}-usage-plan"
      ApiStages:
        - ApiId: !Ref RestApi
          Stage: prod

  ApiKeyResource:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub "${AWS::StackName}-api-key"
      Enabled: true

  ApiUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKeyResource
      KeyType: API_KEY
      UsagePlanId: !Ref ApiUsagePlan

Outputs:
  ConsoleURL:
    Description: "Frontend web URL (ALB)"
    Value: !If
      - EnableHTTPS
      - !Sub "https://${WebAlb.DNSName}"
      - !Sub "http://${WebAlb.DNSName}"

  ConsoleBucketName:
    Description: "S3 bucket that backs the frontend. Upload index.html here."
    Value: !Ref ConsoleBucket

  ApiEndpoint:
    Description: "REST API base URL (requires x-api-key header)"
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com.cn/prod"

  ApiKeyId:
    Description: "API Key ID (not the secret). Get the secret value with this command:"
    Value: !Ref ApiKeyResource

  ApiKeyCommand:
    Description: "Run this command to retrieve the actual API Key secret for frontend login"
    Value: !Sub "aws apigateway get-api-key --api-key ${ApiKeyResource} --include-value --query value --output text --region ${AWS::Region}"

  ScenariosBucketName:
    Description: "S3 bucket where test scripts and results are stored"
    Value: !Ref ScenariosBucket

  ScenariosTableName:
    Value: !Ref ScenariosTable

  HistoryTableName:
    Value: !Ref HistoryTable

  EcsClusterName:
    Value: !Ref EcsCluster

  StateMachineArn:
    Value: !Ref StateMachine
