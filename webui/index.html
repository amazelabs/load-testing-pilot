        const ext = extMap[d.testType] || '.jmx';
        api('GET', '/upload-url?testId=' + encodeURIComponent(d.testId) + '&fileExt=' + encodeURIComponent(ext) + '&testType=' + encodeURIComponent(d.testType) + '&action=download')
          .then(r => fetch(r.downloadUrl))
          .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
          .then(txt => {
            scriptBody.innerHTML = '';
            const dlBtn = el('button', { style: 'margin-bottom:8px;font-size:12px;padding:4px 12px', onclick: () => {
              const blob = new Blob([txt], { type: 'text/plain' });
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = d.testId + ext;
              a.click();
              URL.revokeObjectURL(a.href);
            } }, '⬇ 下载脚本');
            scriptBody.appendChild(dlBtn);
            scriptBody.appendChild(el('pre', { style: 'max-height:400px;overflow:auto;font-size:11px;line-height:1.4;background:#f6f8fa;border:1px solid #e0e5eb;border-radius:6px;padding:12px;white-space:pre;tab-size:2' },
              el('code', {}, txt)));
          })
          .catch(e => { scriptBody.innerHTML = '<div class="muted">脚本加载失败：' + escape(e.message) + '（文件可能已被清理）</div>'; });
      }
    };
    if (d.testPrompt) {
      scriptCard.appendChild(el('div', { style: 'background:#f0f7ff;border:1px solid #c8ddf5;border-radius:6px;padding:10px 14px;margin-bottom:10px;font-size:13px' },
        el('strong', {}, 'AI 生成需求：'), ' ', d.testPrompt));
    }
    scriptCard.appendChild(scriptToggle);
    scriptCard.appendChild(scriptBody);
    body.appendChild(scriptCard);
  }

  // Running tasks
  { const t = _buildTasks(d); if (t) body.appendChild(t); }

  // Progress indicator for running tests
  { const p = _buildProgress(d); if (p) body.appendChild(p); }

  // Latest results
  if (d.results && d.results.total) {
    // Sidebar navigation for long detail pages
    const _oldSidebar = document.querySelector('.detail-sidebar');
    if (_oldSidebar) _oldSidebar.remove();
    const sidebar = el('div', { class: 'detail-sidebar', id: 'detail-sidebar' });
    const secItems = [
      ['sec-summary', '概览'],
      ['sec-timing', '响应时间'],
      ['sec-codes', '响应码'],
      ['sec-history', '历史记录'],
      ['sec-aws', 'AWS 指标'],
      ['sec-ai', 'AI 分析'],
    ];
    const scrollOffset = 108;
    secItems.forEach(([id, label]) => {
      sidebar.appendChild(el('a', { 'data-sec': id, onclick: () => {
        const t = document.getElementById(id);
        if (t) window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - scrollOffset, behavior: 'smooth' });
      }}, label));
    });
    document.body.appendChild(sidebar);
    // Scroll spy
    const spyFn = () => {
      const ids = secItems.map(s => s[0]);
      let active = ids[0];
      for (const id of ids) {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top <= 140) active = id;
      }
      sidebar.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.dataset.sec === active));
    };
    window.addEventListener('scroll', spyFn, { passive: true });
    setTimeout(spyFn, 300);
    // Cleanup on navigation
    const cleanSidebar = () => { sidebar.remove(); window.removeEventListener('scroll', spyFn); };
    window.addEventListener('hashchange', cleanSidebar, { once: true });

    const r = d.results.total;
    const testDur = parseFloat(r.testDuration || '0');
    let holdForSec = 0, rampUpSec = 0;
    try {
      const exec = d.testScenario && d.testScenario.execution && d.testScenario.execution[0];
      if (exec) { holdForSec = parseDuration(exec['hold-for'] || ''); rampUpSec = parseDuration(exec['ramp-up'] || ''); }
    } catch {}
    const totalReqs = parseInt(r.throughput || 0);
    const totalRps = (testDur > 0 && totalReqs) ? (totalReqs / testDur).toFixed(1) : '-';
    // Estimate hold-for phase RPS: during ramp-up, avg concurrency ≈ 50%, so steady-state RPS is higher
    let holdForRps = '-';
    if (testDur > 0 && totalReqs && holdForSec > 0) {
      const effectiveSec = (rampUpSec / 2) + holdForSec; // ramp-up contributes ~half throughput
      holdForRps = (totalReqs / effectiveSec).toFixed(1);
    }
    // Peak RPS estimate: steady-state * 1.0 (no per-second data yet, show hold-for as proxy)
    const peakRps = holdForRps;
    const srNum = (totalReqs > 0) ? (parseInt(r.succ || 0) / totalReqs) * 100 : 0;
    const avgRtMs = r.avg_rt ? parseFloat(r.avg_rt) * 1000 : null;
    const p99Ms = r.p99_0 ? parseFloat(r.p99_0) * 1000 : null;

    // A. Health status banner
    body.appendChild(el('div', { id: 'sec-summary' }));
    body.appendChild(healthBanner(srNum, p99Ms, r.fail || '0', r.topFailures));

    // B. Hero metrics (4 big cards)
    const rpsMainVal = holdForRps !== '-' ? holdForRps : totalRps;
    const rpsLabel = holdForRps !== '-' ? '正式压测 RPS' : 'RPS';
    const rpsSubText = holdForRps !== '-' ? `全程均值 ${totalRps} · 峰值 ≈${peakRps}` : '全程平均';
    body.appendChild(el('div', { class: 'hero-grid' },
      heroMetric('总请求数', r.throughput || '0', '成功 ' + (r.succ || 0) + ' / 失败 ' + (r.fail || 0)),
      heroMetric(rpsLabel, rpsMainVal, rpsSubText),
      heroMetric('成功率', srNum.toFixed(1) + '%', null, srColor(srNum)),
      heroMetric('平均响应时间', avgRtMs != null ? avgRtMs.toFixed(0) + 'ms' : '-', null, rtColor(avgRtMs))
    ));

    // E. Infrastructure badges
    body.appendChild(el('div', { class: 'infra-row' },
      el('span', { class: 'infra-badge' }, '测试时长 ', el('b', {}, testDur ? testDur.toFixed(0) + 's' : '-')),
      el('span', { class: 'infra-badge' }, '爬升 ', el('b', {}, rampUpSec + 's')),
      el('span', { class: 'infra-badge' }, '正式压测', el('b', {}, holdForSec + 's')),
      el('span', { class: 'infra-badge' }, '并发 ', el('b', {}, r.concurrency || '-')),
      el('span', { class: 'infra-badge' }, 'ECS ', el('b', {}, (r.ecsDuration || '-') + 's')),
      r.taskCpu ? el('span', { class: 'infra-badge' }, el('b', {}, r.taskCpu + ' vCPU / ' + (parseInt(r.taskMemory)/1024).toFixed(0) + 'G')) : null,
      r.bytes ? el('span', { class: 'infra-badge' }, '传输 ', el('b', {}, (parseFloat(r.bytes) / 1024 / 1024).toFixed(1) + ' MB')) : null
    ));

    // C. Timing + Percentile chart
    body.appendChild(el('div', { id: 'sec-timing' }));
    const timingPctCard = el('div', { class: 'card' });
    timingPctCard.appendChild(el('h2', {}, '响应时间详情'));
    const twoCol = el('div', { class: 'results-2col' });

    // Left: timing grid
    twoCol.appendChild(el('div', {},
      el('div', { class: 'grid-2', style: 'gap:10px' },
        metric('Avg RT (ms)', avgRtMs != null ? avgRtMs.toFixed(1) : '-'),
        metric('Avg 连接时间 (ms)', r.avg_ct ? (parseFloat(r.avg_ct) * 1000).toFixed(1) : '-'),
        metric('Avg 延迟 (ms)', r.avg_lt ? (parseFloat(r.avg_lt) * 1000).toFixed(1) : '-'),
        metric('RT 标准差 (ms)', r.stdev_rt ? (parseFloat(r.stdev_rt) * 1000).toFixed(1) : '-')
      ),
      el('div', { class: 'muted', style: 'margin-top:10px;font-size:11px' },
        'P0(min) = ' + (r.p0_0 ? (parseFloat(r.p0_0)*1000).toFixed(0) + 'ms' : '-'))
    ));

    // Right: percentile horizontal bar chart
    const pctWrap = el('div', { class: 'pct-chart-container' });
    twoCol.appendChild(pctWrap);
    setTimeout(() => renderPercentileChart(r, pctWrap), 0);

    timingPctCard.appendChild(twoCol);
    body.appendChild(timingPctCard);

    // JTL warnings
    const _jtlW = d.results.jtlWarnings;
    if (_jtlW && _jtlW.length) {
      body.appendChild(el('div', { class: 'alert-warn', style: 'margin-bottom:12px' },
        _jtlW.join('；')));
    }

    // D. Response code donut + table
    if (r.responseCodes && r.responseCodes.length) {
      body.appendChild(el('div', { id: 'sec-codes' }));
      const codeCard = el('div', { class: 'card' });
      codeCard.appendChild(el('h2', {}, '响应码分布'));
      const codeLayout = el('div', { class: 'code-2col' });

      // Left: donut
      const donutWrap = el('div', { class: 'donut-wrap' });
      codeLayout.appendChild(donutWrap);
      setTimeout(() => renderCodeDonut(r.responseCodes, donutWrap), 0);

      // Right: table
      codeLayout.appendChild(el('table', {},
        el('thead', {}, el('tr', {},
          el('th', { style: 'width:100px' }, '响应码'),
          el('th', { style: 'width:80px' }, '次数'),
          el('th', { style: 'width:80px' }, '占比'),
          el('th', {}, '')
        )),
        el('tbody', {}, ...r.responseCodes.map(rc => {
          const pct = parseFloat(rc.percent || '0');
          const bar = el('div', { style: 'height:6px;border-radius:3px;background:#e0e5eb' },
            el('div', { style: 'height:100%;border-radius:3px;width:' + pct + '%;background:' + codeColor(rc.code) })
          );
          return el('tr', {},
            el('td', {}, el('span', { class: 'badge ' + codeBadge(rc.code) }, rc.code)),
            el('td', {}, String(rc.count)),
            el('td', {}, rc.percent + '%'),
            el('td', {}, bar)
          );
        }))
      ));
      codeCard.appendChild(codeLayout);
      body.appendChild(codeCard);
    }

    // F. Top failures (kept)
    if (r.topFailures && r.topFailures.length) {
      body.appendChild(el('div', { class: 'card' },
        el('h2', {}, '错误详情 Top ' + r.topFailures.length),
        el('div', { class: 'muted', style: 'margin-bottom:8px;font-size:12px' }, '鼠标悬停行可查看完整错误信息与 URL'),
        el('table', {},
          el('thead', {}, el('tr', {},
            el('th', { style: 'width:40%' }, '错误信息'),
            el('th', { style: 'width:70px' }, '次数'),
            el('th', { style: 'width:70px' }, '占比'),
            el('th', { style: 'width:70px' }, '响应码'),
            el('th', {}, '示例 URL')
          )),
          el('tbody', {}, ...r.topFailures.map(f => renderFailureRow(f)))
        )
      ));
    }
  }

  // History with comparison
  body.appendChild(el('div', { id: 'sec-history' }));
  window._selectedRuns = window._selectedRuns || new Set();
  const hist = (d.history || []).slice().sort((a,b) => (b.startTime||'').localeCompare(a.startTime||''));
  const histCard = el('div', { class: 'card' });
  histCard.appendChild(el('h2', {}, `测试运行历史（${hist.length}）`));
  if (hist.length === 0) {
    histCard.appendChild(el('div', { class: 'muted' }, '暂无历史记录'));
  } else {
    histCard.appendChild(el('table', {},
      el('thead', {}, el('tr', {},
        el('th', { style: 'width:36px' }, ''),
        el('th', {}, 'Run ID'),
        el('th', {}, '开始时间'),
        el('th', {}, '结束时间'),
        el('th', {}, '状态'),
        el('th', {}, '平均 RT'),
        el('th', {}, '成功/失败')
      )),
      el('tbody', {}, ...hist.slice(0, 30).map(h => {
        const t = (h.results && h.results.total) || {};
        const hasData = !!(h.results && h.results.total);
        return el('tr', {},
          el('td', {}, hasData ? el('input', {
            type: 'checkbox',
            checked: window._selectedRuns.has(h.testRunId) ? 'checked' : null,
            onchange: (e) => {
              if (e.target.checked) window._selectedRuns.add(h.testRunId);
              else window._selectedRuns.delete(h.testRunId);
              updateCompareBtn();
            }
          }) : null),
          el('td', { class: 'mono' }, h.testRunId),
          el('td', {}, fmtTime(h.startTime)),
          el('td', {}, fmtTime(h.endTime)),
          el('td', {}, el('span', { class: 'badge b-' + h.status }, h.status)),
          el('td', {}, t.avg_rt ? (parseFloat(t.avg_rt) * 1000).toFixed(0) + 'ms' : '-'),
          el('td', {}, (t.succ || 0) + ' / ' + (t.fail || 0))
        );
      }))
    ));
    const compareRow = el('div', { style: 'display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:10px' },
      el('span', { id: 'compare-count', class: 'muted' }),
      el('button', { id: 'compare-btn', disabled: 'disabled', onclick: () => showComparison(hist) }, '对比选中')
    );
    histCard.appendChild(compareRow);
  }
  body.appendChild(histCard);
  // Comparison result container
  body.appendChild(el('div', { id: 'compare-body' }));
  updateCompareBtn();

  // AWS 资源 & 指标 + AI 分析（仅在测试已完成时展示）
  if (d.status === 'complete' && d.results && d.results.total) {
    body.appendChild(el('div', { id: 'sec-aws' }));
    body.appendChild(renderAwsContextCard(d));
    body.appendChild(el('div', { id: 'sec-ai' }));
    body.appendChild(renderAiCard(d));
    if (d.awsContext) {
      const ctx = _fixNums(d.awsContext);
      window._lastAwsContext = ctx;
      setTimeout(() => renderAwsContextBody(ctx), 100);
    } else {
      setTimeout(() => loadAwsContext(d), 100);
    }
  }
}

// --- Test run comparison ---
function updateCompareBtn() {
  const btn = $('#compare-btn'), cnt = $('#compare-count');
  const n = window._selectedRuns ? window._selectedRuns.size : 0;
  if (btn) btn.disabled = n < 2;
  if (cnt) cnt.textContent = n > 0 ? `已选 ${n} 项` : '';
}

function showComparison(hist) {
  const body = $('#compare-body');
  if (!body) return;
  body.innerHTML = '';
  const selected = hist.filter(h => window._selectedRuns.has(h.testRunId) && h.results);
  if (selected.length < 2) { showError('请选择至少 2 条已完成的运行记录'); return; }

  const metrics = [
    { key: 'throughput', label: '总请求数', fmt: v => v || '-' },
    { key: 'succ', label: '成功数', fmt: v => v || '-' },
    { key: 'fail', label: '失败数', fmt: v => v || '-', invert: true },
    { key: 'avg_rt', label: 'Avg RT (ms)', fmt: v => v ? (parseFloat(v) * 1000).toFixed(1) : '-', invert: true },
    { key: 'p50_0', label: 'P50 (ms)', fmt: v => v ? (parseFloat(v) * 1000).toFixed(0) : '-', invert: true },
    { key: 'p95_0', label: 'P95 (ms)', fmt: v => v ? (parseFloat(v) * 1000).toFixed(0) : '-', invert: true },
    { key: 'p99_0', label: 'P99 (ms)', fmt: v => v ? (parseFloat(v) * 1000).toFixed(0) : '-', invert: true },
    { key: 'concurrency', label: '并发数', fmt: v => v || '-' },
    { key: 'testDuration', label: '测试时长 (s)', fmt: v => v ? parseFloat(v).toFixed(0) : '-' },
  ];

  const hasDelta = selected.length === 2;
  const headerCells = [el('th', { style: 'min-width:120px' }, '指标')];
  selected.forEach(h => headerCells.push(el('th', {}, fmtTime(h.startTime).slice(5))));
  if (hasDelta) headerCells.push(el('th', {}, '变化'));

  const rows = metrics.map(m => {
    const vals = selected.map(h => ((h.results && h.results.total) || {})[m.key]);
    const cells = [el('td', { style: 'font-weight:500' }, m.label)];
    vals.forEach(v => cells.push(el('td', {}, m.fmt(v))));
    if (hasDelta && vals[0] != null && vals[1] != null) {
      const a = parseFloat(vals[0]) || 0, b = parseFloat(vals[1]) || 0;
      if (a > 0) {
        const pct = ((b - a) / a * 100).toFixed(1);
        const better = m.invert ? b < a : b > a;
        const worse = m.invert ? b > a : b < a;
        const arrow = b > a ? '↑' : b < a ? '↓' : '-';
        const color = better ? '#1d7a2b' : worse ? '#d13212' : '#6a737d';
        cells.push(el('td', { style: 'color:' + color + ';font-weight:600' }, arrow + ' ' + pct + '%'));
      } else {
        cells.push(el('td', { class: 'muted' }, '-'));
      }
    }
    return el('tr', {}, ...cells);
  });

  const card = el('div', { class: 'card' },
    el('h2', {}, '运行对比'),
    el('table', {},
      el('thead', {}, el('tr', {}, ...headerCells)),
      el('tbody', {}, ...rows)
    )
  );
  body.appendChild(card);
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// --- AWS Context card (ELB / target groups / EC2 + CloudWatch 指标) ---
function renderAwsContextCard(d) {
  const card = el('div', { class: 'card' });
  card.appendChild(el('h2', {}, 'AWS 资源 & 指标'));

  // 从 test scenario 中提取默认 target hostname
  let defaultTarget = '';
  try {
    const sc = d.testScenario && d.testScenario.scenarios;
    const s1 = sc && (sc.scenario1 || sc[Object.keys(sc)[0]]);
    // Simple test: URL is in requests array
    if (s1 && s1.requests && s1.requests[0] && s1.requests[0].url) {
      defaultTarget = new URL(s1.requests[0].url).hostname;
    }
    // Script test: check scriptTarget (extracted from script at upload time)
    if (!defaultTarget && d.testScenario && d.testScenario.scriptTarget) {
      defaultTarget = d.testScenario.scriptTarget;
    }
    if (!defaultTarget && d.testDescription) {
      const urlMatch = d.testDescription.match(/https?:\/\/([^\s\/]+)/);
      if (urlMatch) defaultTarget = urlMatch[1];
    }
  } catch {}

  const startISO = (d.startTime || '').replace(' ', 'T') + (d.startTime && d.startTime.endsWith('Z') ? '' : 'Z');
  const endISO   = (d.endTime || '').replace(' ', 'T') + (d.endTime && d.endTime.endsWith('Z') ? '' : 'Z');

  const savedRegion = (d.testTaskConfigs && d.testTaskConfigs[0] && d.testTaskConfigs[0].region) || defaultRegion;
  const acRegionSelect = el('select', { id: 'ac-region', style: 'width:160px' });
  ['cn-north-1', 'cn-northwest-1'].forEach(r => {
    const opt = el('option', { value: r }, r);
    if (r === savedRegion) opt.selected = true;
    acRegionSelect.appendChild(opt);
  });

  card.appendChild(el('div', { class: 'row' },
    el('label', {}, '压测目标（hostname 或 IP，默认取自测试配置）'),
    el('div', { style: 'display:flex;gap:8px' },
      el('input', { type: 'text', id: 'ac-target', value: defaultTarget, placeholder: 'example.elb.amazonaws.com.cn 或 10.0.1.5', style: 'flex:1' }),
      acRegionSelect,
      el('button', { class: 'primary', onclick: () => loadAwsContext(d) }, '查询')
    )
  ));

  // Cross-account credential config (ephemeral, read from window._awsCred or form)
  const memCred = (window._awsCred || {})[d.testId] || {};
  const hasMemCred = !!memCred.mode;
  const credBody = el('div', { class: 'cred-body', id: 'cred-body', style: hasMemCred ? '' : 'display:none' });
  const toggle = el('div', { class: 'cred-toggle', onclick: () => {
    const b = $('#cred-body');
    const hidden = b.style.display === 'none';
    b.style.display = hidden ? '' : 'none';
    toggle.textContent = (hidden ? '▾' : '▸') + ' 跨账号凭据配置';
  }}, (hasMemCred ? '▾' : '▸') + ' 跨账号凭据配置');
  card.appendChild(toggle);

  const modes = [
    { value: '', label: '当前账号（默认）' },
    { value: 'aksk', label: 'AK/SK' },
    { value: 'temp', label: '临时凭据（AK/SK + SessionToken）' },
    { value: 'role', label: 'Assume Role（输入 Role ARN）' },
  ];
  const radioGroup = el('div', { class: 'radio-group' });
  modes.forEach(m => {
    const radio = el('input', { type: 'radio', name: 'aws-cred-mode', value: m.value });
    if ((memCred.mode || '') === m.value) radio.checked = true;
    radio.onchange = () => renderCredFields(d.testId);
    radioGroup.appendChild(el('label', {}, radio, ' ' + m.label));
  });
  credBody.appendChild(radioGroup);
  credBody.appendChild(el('div', { id: 'cred-fields' }));
  credBody.appendChild(el('div', { class: 'cred-hint' }, '凭据不会持久化，刷新页面后需重新输入。'));
  card.appendChild(credBody);
  setTimeout(() => renderCredFields(d.testId, memCred), 0);

  card.appendChild(el('div', { id: 'aws-context-body' },
    el('div', { class: 'muted' }, '点击"查询"加载 ELB / 目标组 / EC2 指标。窗口为测试 startTime → endTime。')
  ));
  return card;
}

function renderCredFields(testId, saved) {
  const container = $('#cred-fields');
  if (!container) return;
  container.innerHTML = '';
  const mode = (document.querySelector('input[name="aws-cred-mode"]:checked') || {}).value || '';
  if (!mode) return;
  const s = saved || getAwsCredConfig(testId);
  if (mode === 'aksk' || mode === 'temp') {
    container.appendChild(el('label', {}, 'Access Key ID'));
    container.appendChild(el('input', { type: 'text', id: 'cred-ak', value: s.accessKeyId || '', placeholder: 'AKIA...' }));
    container.appendChild(el('label', {}, 'Secret Access Key'));
    container.appendChild(el('input', { type: 'password', id: 'cred-sk', value: s.secretAccessKey || '', placeholder: '...' }));
    if (mode === 'temp') {
      container.appendChild(el('label', {}, 'Session Token'));
      container.appendChild(el('input', { type: 'password', id: 'cred-token', value: s.sessionToken || '', placeholder: '...' }));
    }
  } else if (mode === 'role') {
    container.appendChild(el('label', {}, 'Role ARN'));
    container.appendChild(el('input', { type: 'text', id: 'cred-role', value: s.roleArn || '', placeholder: 'arn:aws-cn:iam::123456789012:role/MyRole' }));
    const roleArn = window._lambdaRoleArn || '（请先点击"查询"获取）';
    const trustPolicy = JSON.stringify({
      Version: '2012-10-17',
      Statement: [{ Effect: 'Allow', Principal: { AWS: roleArn }, Action: 'sts:AssumeRole' }]
    }, null, 2);
    container.appendChild(el('label', {}, '目标 Role 需要的信任策略（Trust Policy）'));
    container.appendChild(el('pre', { id: 'trust-policy-pre' }, trustPolicy));
    const permPolicy = 'elasticloadbalancing:Describe*\nec2:DescribeInstances\nec2:DescribeNetworkInterfaces\ncloudwatch:GetMetricData';
    container.appendChild(el('label', {}, '目标 Role 需要的权限（Permissions）'));
    container.appendChild(el('pre', {}, permPolicy));
  }
}

function readCredFields() {
  const mode = (document.querySelector('input[name="aws-cred-mode"]:checked') || {}).value || '';
  if (!mode) return {};
  const cfg = { mode };
  if (mode === 'aksk' || mode === 'temp') {
    cfg.accessKeyId = ($('#cred-ak') || {}).value || '';
    cfg.secretAccessKey = ($('#cred-sk') || {}).value || '';
    if (mode === 'temp') cfg.sessionToken = ($('#cred-token') || {}).value || '';
  } else if (mode === 'role') {
    cfg.roleArn = ($('#cred-role') || {}).value || '';
  }
  return cfg;
}

async function loadAwsContext(d) {
  const target = ($('#ac-target').value || '').trim();
  if (!target) { showError('请填写压测目标'); return; }
  const container = $('#aws-context-body');
  container.innerHTML = '<div class="loading">查询 AWS 资源中...</div>';

  const start = new Date(d.startTime + (d.startTime.endsWith('Z') ? '' : 'Z'));
  const end   = new Date(d.endTime + (d.endTime.endsWith('Z') ? '' : 'Z'));

  const region = ($('#ac-region') || {}).value || defaultRegion;
  const reqBody = { target, region, startTime: start.toISOString(), endTime: end.toISOString() };
  const credCfg = readCredFields();
  if (credCfg && credCfg.mode) reqBody.credentials = credCfg;

  try {
    const ctx = await api('POST', '/aws-context', reqBody);
    window._lastAwsContext = ctx;
    if (ctx.lambdaRoleArn) {
      window._lambdaRoleArn = ctx.lambdaRoleArn;
      const pp = $('#trust-policy-pre');
      if (pp) pp.textContent = JSON.stringify({ Version: '2012-10-17', Statement: [{ Effect: 'Allow', Principal: { AWS: ctx.lambdaRoleArn }, Action: 'sts:AssumeRole' }] }, null, 2);
    }
    renderAwsContextBody(ctx);
    // 仅当找到资源时保存到 DynamoDB
    if (ctx.elb || (ctx.instances && ctx.instances.length)) {
      api('PUT', '/scenarios/' + d.testId, { awsContext: ctx })
        .catch(e => console.warn('Save awsContext failed:', e));
    }
  } catch (e) {
    container.innerHTML = '';
    container.appendChild(el('div', { class: 'error' }, e.message));
  }
}

function renderAwsContextBody(ctx) {
  const body = $('#aws-context-body');
  body.innerHTML = '';

  // ELB
  if (ctx.elb) {
    const lb = ctx.elb;
    const m = lb.metrics || {};
    const isNlb = (lb.type || '').toLowerCase() === 'network';
    const metricsGrid = isNlb
      ? el('div', { class: 'grid-4' },
          metric('ActiveFlowCount', m.ActiveFlowCount ? m.ActiveFlowCount.avg.toFixed(0) : '-'),
          metric('NewFlowCount', m.NewFlowCount ? m.NewFlowCount.sum.toFixed(0) : '-'),
          metric('流量(MB)', m.ProcessedBytes ? (m.ProcessedBytes.sum/1024/1024).toFixed(1) : '-'),
          metric('TCP Target Reset', m.TCP_Target_Reset_Count ? m.TCP_Target_Reset_Count.sum.toFixed(0) : '-')
        )
      : el('div', {},
          el('div', { class: 'grid-4', style: 'margin-bottom:6px' },
            metric('请求总数', m.RequestCount ? m.RequestCount.sum.toFixed(0) : '-'),
            metric('Target avg 响应时间(s)', m.TargetResponseTime ? m.TargetResponseTime.avg.toFixed(3) : '-'),
            metric('Target 5xx', m.HTTPCode_Target_5XX_Count ? m.HTTPCode_Target_5XX_Count.sum.toFixed(0) : '-'),
            metric('ELB 5xx', m.HTTPCode_ELB_5XX_Count ? m.HTTPCode_ELB_5XX_Count.sum.toFixed(0) : '-')
          ),
          el('div', { class: 'grid-4' },
            metric('ConsumedLCUs', m.ConsumedLCUs ? m.ConsumedLCUs.avg.toFixed(2) : '-'),
            metric('连接错误', m.TargetConnectionErrorCount ? m.TargetConnectionErrorCount.sum.toFixed(0) : '0'),
            metric('ELB 4xx', m.HTTPCode_ELB_4XX_Count ? m.HTTPCode_ELB_4XX_Count.sum.toFixed(0) : '0'),
            metric('流量(MB)', m.ProcessedBytes ? (m.ProcessedBytes.sum/1024/1024).toFixed(1) : '-')
          )
        );
    body.appendChild(el('div', { style: 'margin-bottom:16px' },
      el('h2', { style: 'font-size:14px' }, `ELB · ${lb.type || ''} · ${lb.name}`),
      el('div', { class: 'muted', style: 'margin-bottom:8px' }, `${lb.dnsName || ''} · ${lb.scheme || ''} · ${lb.vpcId || ''}`),
      metricsGrid
    ));
  } else if (ctx.isIp) {
    body.appendChild(el('div', { class: 'muted', style: 'margin-bottom:16px' }, `直接压测 IP：${ctx.host}（未通过 ELB）`));
  } else {
    body.appendChild(el('div', { class: 'muted', style: 'margin-bottom:16px' }, `未在账号中匹配到 ELB。域名：${ctx.host}`));
  }

  // Target groups
  if (ctx.targetGroups && ctx.targetGroups.length) {
    body.appendChild(el('h2', { style: 'font-size:14px;margin-top:16px' }, `目标组（${ctx.targetGroups.length}）`));
    for (const tg of ctx.targetGroups) {
      const m = tg.metrics || {};
      body.appendChild(el('div', { style: 'border:1px solid #e0e5eb;border-radius:4px;padding:12px;margin-top:8px' },
        el('div', { style: 'display:flex;justify-content:space-between;margin-bottom:8px' },
          el('strong', {}, tg.name + ' '),
          el('span', { class: 'muted' }, `${tg.protocol}:${tg.port} · targetType=${tg.targetType}`)
        ),
        el('div', { class: 'grid-4' },
          metric('健康实例(最小)', m.HealthyHostCount ? m.HealthyHostCount.min.toFixed(0) : '-'),
          metric('不健康实例(最大)', m.UnHealthyHostCount ? m.UnHealthyHostCount.max.toFixed(0) : '-'),
          metric('avg 响应时间(s)', m.TargetResponseTime ? m.TargetResponseTime.avg.toFixed(3) : '-'),
          metric('每 target 请求数', m.RequestCountPerTarget ? m.RequestCountPerTarget.sum.toFixed(0) : '-')
        ),
        tg.targets && tg.targets.length ? el('div', { style: 'margin-top:8px' },
          el('div', { class: 'muted', style: 'margin-bottom:4px' }, '注册目标：'),
          el('table', {},
            el('thead', {}, el('tr', {},
              el('th', {}, 'ID / IP'),
              el('th', {}, '端口'),
              el('th', {}, '状态'),
              el('th', {}, '原因')
            )),
            el('tbody', {}, ...tg.targets.map(t => el('tr', {},
              el('td', { class: 'mono' }, t.id),
              el('td', {}, String(t.port)),
              el('td', {}, el('span', { class: 'badge ' + (t.state === 'healthy' ? 'b-complete' : 'b-failed') }, t.state)),
              el('td', { class: 'muted', style: 'font-size:11px' }, t.description || t.reason || '-')
            )))
          )
        ) : null
      ));
    }
  }

  // EC2 instances — compact table with expandable detail
  if (ctx.instances && ctx.instances.length) {
    body.appendChild(el('h2', { style: 'font-size:14px;margin-top:16px' }, `后端 EC2（${ctx.instances.length}）`));
    const hasCredit = ctx.instances.some(i => (i.instanceType || '').match(/^t\d/));
    const thead = el('tr', {},
      el('th', {}, '名称/ID'), el('th', {}, '类型'), el('th', {}, 'AZ'),
      el('th', {}, 'CPU avg%'), el('th', {}, 'CPU max%'),
      el('th', {}, '网络入(MB)'), el('th', {}, '网络出(MB)'),
      el('th', {}, '状态检查'),
      hasCredit ? el('th', {}, 'CPU 信用') : null,
      el('th', {}, 'EBS队列')
    );
    const tbody = el('tbody', {});
    for (const inst of ctx.instances) {
      const m = inst.metrics || {};
      const ebsMetrics = inst.ebsMetrics || {};
      let maxQueue = 0, totalReadMB = 0, totalWriteMB = 0, totalReadOps = 0, totalWriteOps = 0, minBurst = Infinity;
      for (const vid in ebsMetrics) {
        const em = ebsMetrics[vid] || {};
        if (em.VolumeQueueLength && em.VolumeQueueLength.max > maxQueue) maxQueue = em.VolumeQueueLength.max;
        if (em.VolumeReadBytes) totalReadMB += (em.VolumeReadBytes.sum || 0) / 1024 / 1024;
        if (em.VolumeWriteBytes) totalWriteMB += (em.VolumeWriteBytes.sum || 0) / 1024 / 1024;
        if (em.VolumeReadOps) totalReadOps += em.VolumeReadOps.sum || 0;
        if (em.VolumeWriteOps) totalWriteOps += em.VolumeWriteOps.sum || 0;
        if (em.BurstBalance && em.BurstBalance.min < minBurst) minBurst = em.BurstBalance.min;
      }
      const statusFail = m.StatusCheckFailed ? m.StatusCheckFailed.max : 0;
      const creditMin = m.CPUCreditBalance ? m.CPUCreditBalance.min : null;
      const rowStyle = statusFail > 0 ? 'background:#fff0f0;' : (creditMin !== null && creditMin < 5 ? 'background:#fff8e6;' : '');
      const row = el('tr', { style: rowStyle + 'cursor:pointer', onclick: function() { const d = this.nextElementSibling; d.style.display = d.style.display === 'none' ? '' : 'none'; } },
        el('td', { style: 'font-weight:500' }, inst.name || inst.instanceId),
        el('td', { class: 'mono', style: 'font-size:12px' }, inst.instanceType),
        el('td', { style: 'font-size:12px' }, inst.az),
        el('td', {}, m.CPUUtilization ? m.CPUUtilization.avg.toFixed(1) : '-'),
        el('td', {}, m.CPUUtilization ? m.CPUUtilization.max.toFixed(1) : '-'),
        el('td', {}, m.NetworkIn ? (m.NetworkIn.sum / 1024 / 1024).toFixed(1) : '-'),
        el('td', {}, m.NetworkOut ? (m.NetworkOut.sum / 1024 / 1024).toFixed(1) : '-'),
        el('td', {}, el('span', { class: 'badge ' + (statusFail > 0 ? 'b-failed' : 'b-complete') }, statusFail > 0 ? 'FAIL' : 'OK')),
        hasCredit ? el('td', {}, creditMin !== null ? creditMin.toFixed(1) : '-') : null,
        el('td', {}, maxQueue.toFixed(2))
      );
      const volumes = inst.volumes || [];
      const detailRow = el('tr', { style: 'display:none' },
        el('td', { colspan: hasCredit ? 10 : 9, style: 'padding:8px 12px;background:#f9fafb;font-size:12px' },
          el('div', { style: 'margin-bottom:4px' },
            el('span', { class: 'mono muted' }, `${inst.instanceId} · ${inst.privateIp}`)),
          el('div', { class: 'grid-4', style: 'margin-bottom:8px' },
            metric('EBS Read Ops', totalReadOps.toFixed(0)),
            metric('EBS Write Ops', totalWriteOps.toFixed(0)),
            metric('EBS Read(MB)', totalReadMB.toFixed(1)),
            metric('EBS Write(MB)', totalWriteMB.toFixed(1))
          ),
          minBurst < Infinity ? el('div', { class: 'muted', style: 'margin-bottom:4px' }, `EBS BurstBalance min: ${minBurst.toFixed(1)}%`) : null,
          volumes.length ? el('div', { class: 'mono muted', style: 'font-size:11px' },
            volumes.map(v => `${v.device} → ${v.volumeId}`).join(' · ')
          ) : null
        )
      );
      tbody.appendChild(row);
      tbody.appendChild(detailRow);
    }
    body.appendChild(el('table', { style: 'margin-top:8px' }, el('thead', {}, thead), tbody));
  }

  if (!ctx.elb && (!ctx.instances || ctx.instances.length === 0)) {
    body.appendChild(el('div', { class: 'alert-warn' }, '未找到对应的 AWS 资源。请确认：1) 压测目标 hostname 是 ELB DNSName 或 CNAME；2) Lambda 有权限访问这些 ELB；3) 如果目标资源在其他 AWS 账号，请展开"跨账号凭据配置"填写对应凭据后重新查询。'));
  }

  // --- 时间线图表 ---
  renderMetricCharts(body, ctx);
}

function renderMetricCharts(container, ctx) {
  if (!window.Chart) return; // Chart.js not loaded

  const chartSection = el('div', { style: 'margin-top:24px' });
  chartSection.appendChild(el('h2', { style: 'font-size:14px;margin-bottom:12px' }, '指标时间线'));

  const charts = [];

  // ELB charts
  if (ctx.elb && ctx.elb.metrics) {
    const m = ctx.elb.metrics;
    if (m.RequestCount && m.RequestCount.timestamps.length) {
      charts.push({ title: `ELB 请求数 (${ctx.elb.name})`, metrics: { 'RequestCount': m.RequestCount } });
    }
    if (m.TargetResponseTime && m.TargetResponseTime.timestamps.length) {
      charts.push({ title: `ELB Target 响应时间 (s)`, metrics: { 'TargetResponseTime': m.TargetResponseTime } });
    }
    const codes = {};
    if (m.HTTPCode_Target_2XX_Count && m.HTTPCode_Target_2XX_Count.timestamps.length) codes['2XX'] = m.HTTPCode_Target_2XX_Count;
    if (m.HTTPCode_Target_4XX_Count && m.HTTPCode_Target_4XX_Count.timestamps.length) codes['4XX'] = m.HTTPCode_Target_4XX_Count;
    if (m.HTTPCode_Target_5XX_Count && m.HTTPCode_Target_5XX_Count.timestamps.length) codes['5XX'] = m.HTTPCode_Target_5XX_Count;
    if (m.HTTPCode_ELB_5XX_Count && m.HTTPCode_ELB_5XX_Count.timestamps.length) codes['ELB 5XX'] = m.HTTPCode_ELB_5XX_Count;
    if (Object.keys(codes).length) charts.push({ title: 'ELB HTTP 响应码', metrics: codes });
    if (m.ActiveConnectionCount && m.ActiveConnectionCount.timestamps.length) {
      charts.push({ title: 'ELB 活跃连接数', metrics: { 'ActiveConn': m.ActiveConnectionCount } });
    }
    if (m.ConsumedLCUs && m.ConsumedLCUs.timestamps.length) {
      charts.push({ title: 'ALB ConsumedLCUs', metrics: { 'LCUs': m.ConsumedLCUs } });
    }
  }

  // Target group health charts
  if (ctx.targetGroups && ctx.targetGroups.length) {
    for (const tg of ctx.targetGroups) {
      const m = tg.metrics || {};
      const hostMetrics = {};
      if (m.HealthyHostCount && m.HealthyHostCount.timestamps && m.HealthyHostCount.timestamps.length)
        hostMetrics['Healthy'] = m.HealthyHostCount;
      if (m.UnHealthyHostCount && m.UnHealthyHostCount.timestamps && m.UnHealthyHostCount.timestamps.length)
        hostMetrics['UnHealthy'] = m.UnHealthyHostCount;
      if (Object.keys(hostMetrics).length)
        charts.push({ title: `目标组健康状态 (${tg.name})`, metrics: hostMetrics });
    }
  }

  // EC2 charts — aggregate when >5 instances
  if (ctx.instances && ctx.instances.length) {
    const many = ctx.instances.length > 5;
    const cpuMetrics = {};
    const netInMetrics = {};
    const netOutMetrics = {};
    const creditMetrics = {};
    const ebsQueueMetrics = {};
    const burstMetrics = {};

    for (const inst of ctx.instances) {
      const label = inst.name || inst.instanceId;
      const m = inst.metrics || {};
      if (m.CPUUtilization && m.CPUUtilization.timestamps.length) cpuMetrics[label] = m.CPUUtilization;
      if (m.NetworkIn && m.NetworkIn.timestamps.length) netInMetrics[label + ' In'] = m.NetworkIn;
      if (m.NetworkOut && m.NetworkOut.timestamps.length) netOutMetrics[label + ' Out'] = m.NetworkOut;
      if (m.CPUCreditBalance && m.CPUCreditBalance.timestamps.length) creditMetrics[label] = m.CPUCreditBalance;
      const ebsMetrics = inst.ebsMetrics || {};
      for (const vid in ebsMetrics) {
        const em = ebsMetrics[vid] || {};
        const vlabel = many ? label : `${label} (…${vid.slice(-8)})`;
        if (em.VolumeQueueLength && em.VolumeQueueLength.timestamps.length) ebsQueueMetrics[vlabel] = em.VolumeQueueLength;
        if (em.BurstBalance && em.BurstBalance.timestamps.length && em.BurstBalance.max > 0) burstMetrics[vlabel] = em.BurstBalance;
      }
    }

    // Helper: build min/avg/max band from multiple series (for >5 instances)
    function aggregateBand(metricsMap, title) {
      const entries = Object.values(metricsMap);
      if (!entries.length) return;
      const ts = entries[0].timestamps;
      const minVals = [], avgVals = [], maxVals = [];
      for (let i = 0; i < ts.length; i++) {
        const vals = entries.map(e => e.values[i]).filter(v => v !== undefined);
        if (!vals.length) { minVals.push(0); avgVals.push(0); maxVals.push(0); continue; }
        minVals.push(Math.min(...vals));
        avgVals.push(vals.reduce((a, b) => a + b, 0) / vals.length);
        maxVals.push(Math.max(...vals));
      }
      charts.push({ title: title + ` (${entries.length} 实例, min/avg/max)`, band: true, metrics: {
        'max': { timestamps: ts, values: maxVals },
        'avg': { timestamps: ts, values: avgVals },
        'min': { timestamps: ts, values: minVals },
      }});
    }

    if (many) {
      if (Object.keys(cpuMetrics).length) aggregateBand(cpuMetrics, 'EC2 CPU Utilization (%)');
      const allNet = { ...netInMetrics, ...netOutMetrics };
      if (Object.keys(allNet).length) aggregateBand(allNet, 'EC2 网络流量 (bytes)');
      if (Object.keys(ebsQueueMetrics).length) aggregateBand(ebsQueueMetrics, 'EBS Volume Queue Length');
    } else {
      if (Object.keys(cpuMetrics).length) charts.push({ title: 'EC2 CPU Utilization (%)', metrics: cpuMetrics, yMax: 100 });
      const netMetrics = { ...netInMetrics, ...netOutMetrics };
      if (Object.keys(netMetrics).length) charts.push({ title: 'EC2 网络流量 (bytes)', metrics: netMetrics });
      if (Object.keys(ebsQueueMetrics).length) charts.push({ title: 'EBS Volume Queue Length', metrics: ebsQueueMetrics });
    }
    if (Object.keys(creditMetrics).length) charts.push({ title: 'EC2 CPU Credit Balance (T系列)', metrics: creditMetrics });
    if (Object.keys(burstMetrics).length) charts.push({ title: 'EBS BurstBalance % (gp2)', metrics: burstMetrics, yMax: 100 });
  }

  if (charts.length === 0) return;

  const COLORS = ['#ff9900','#1f77b4','#2ca02c','#d62728','#9467bd','#8c564b','#e377c2','#7f7f7f'];

  for (const chartDef of charts) {
    const wrapper = el('div', { class: 'chart-container' });
    const canvas = el('canvas', {});
    wrapper.appendChild(canvas);
    chartSection.appendChild(el('div', { style: 'margin-bottom:4px;font-weight:500;font-size:13px' }, chartDef.title));
    chartSection.appendChild(wrapper);

    const datasets = [];
    let labels = [];
    let colorIdx = 0;
    for (const [name, data] of Object.entries(chartDef.metrics)) {
      if (data.timestamps.length > labels.length) {
        labels = data.timestamps.map(t => {
          const d = new Date(t);
          return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0') + ':' + d.getSeconds().toString().padStart(2,'0');
        });
      }
      if (chartDef.band) {
        // Band mode: max (filled to avg), avg (line), min (filled down)
        const isMax = name === 'max', isMin = name === 'min', isAvg = name === 'avg';
        datasets.push({
          label: name,
          data: data.values,
          borderColor: isAvg ? '#ff9900' : '#ff990060',
          backgroundColor: isMax ? '#ff990020' : (isMin ? '#ffffff' : 'transparent'),
          borderWidth: isAvg ? 2 : 1,
          borderDash: isAvg ? [] : [4, 2],
          pointRadius: 0, pointHoverRadius: 3,
          fill: isMax ? '+1' : (isMin ? 'origin' : false),
          tension: 0.3,
        });
      } else {
        datasets.push({
          label: name,
          data: data.values,
          borderColor: COLORS[colorIdx % COLORS.length],
          backgroundColor: COLORS[colorIdx % COLORS.length] + '20',
          borderWidth: 1.5,
          pointRadius: 0,
          pointHoverRadius: 4,
          fill: datasets.length === 0,
          tension: 0.3,
        });
      }
      colorIdx++;
    }

    new Chart(canvas, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          tooltip: { enabled: true },
          legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
        },
        scales: {
          x: { ticks: { maxTicksLimit: 12, font: { size: 10 } } },
          y: Object.assign(
            { beginAtZero: true, ticks: { font: { size: 10 } } },
            chartDef.yMax != null ? { max: chartDef.yMax, suggestedMax: chartDef.yMax } : {}
          ),
        },
      },
    });
  }

  container.appendChild(chartSection);
}

// --- AI 分析卡片 ---
function renderAiCard(d) {
  const hasSaved = !!d.aiAnalysis;
  const card = el('div', { class: 'card ai-card' });
  card.appendChild(el('div', { class: 'ai-card-head' },
    el('div', { class: 'ai-card-title' },
      el('span', { class: 'ai-card-icon' }, '✦'),
      el('h2', {}, 'AI 分析')
    ),
    el('div', { style: 'display:flex;gap:8px;align-items:center' },
      el('button', { onclick: exportAiAnalysis }, '导出'),
      el('button', { class: 'primary', onclick: () => runAiAnalysis(d) }, hasSaved ? '重新分析' : '开始分析')
    )
  ));
  card.appendChild(el('div', { class: 'muted', style: 'margin-bottom:12px' }, '调用 LLM 对压测结果 + AWS 指标进行分析，给出性能瓶颈定位与优化建议。'));
  const bodyEl = el('div', { id: 'ai-analysis-body' });
  if (hasSaved) {
    _lastAiContent = d.aiAnalysis;
    bodyEl.appendChild(el('div', { class: 'ai-saved-badge' }, '✓ 已保存的分析结果'));
    const outEl = el('div', { class: 'ai-output' });
    outEl.innerHTML = marked.parse(d.aiAnalysis);
    bodyEl.appendChild(outEl);
  }
  card.appendChild(bodyEl);
  return card;
}

function exportAiAnalysis() {
  if (!_lastAiContent) { showError('暂无分析结果可导出'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(_lastAiContent).then(
      () => showSuccess('已复制到剪贴板（Markdown 格式）'),
      () => downloadAiMd()
    );
  } else { downloadAiMd(); }
}
function downloadAiMd() {
  const blob = new Blob([_lastAiContent], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = 'ai-analysis-' + new Date().toISOString().slice(0, 10) + '.md';
  a.click(); URL.revokeObjectURL(url);
  showSuccess('已下载 Markdown 文件');
}

function getLlmConfig() {
  try { return JSON.parse(localStorage.getItem('load-testing-pilot.llm') || '{}'); }
  catch { return {}; }
}

async function runAiAnalysis(d) {
  const cfg = getLlmConfig();
  if (!cfg.baseUrl || !cfg.apiKey || !cfg.model) {
    showError('请先到「AI 设置」里配置 baseUrl / apiKey / model');
    return;
  }
  const body = $('#ai-analysis-body');
  body.innerHTML = '';
  const infoBar = el('div', { class: 'ai-status-bar' },
    el('span', { class: 'ai-pulse-dot' }),
    el('span', {}, '正在连接 LLM...')
  );
  const out = el('div', { class: 'ai-output ai-streaming' });
  body.appendChild(infoBar);
  body.appendChild(out);
  body.scrollIntoView({ behavior: 'smooth', block: 'start' });

  // 构造输入：压测结果 + AWS 上下文
  const r = (d.results && d.results.total) || {};
  const summary = {
    testName: d.testName,
    testType: d.testType,
    scenario: d.testScenario,
    duration: { start: d.startTime, end: d.endTime },
    taskConfigs: d.testTaskConfigs,
    results: {
      totalRequests: r.throughput,
      success: r.succ,
      failure: r.fail,
      testDurationSec: r.testDuration,
      avgResponseTimeSec: r.avg_rt,
      avgConnectTimeSec: r.avg_ct,
      avgLatencySec: r.avg_lt,
      stdevResponseTimeSec: r.stdev_rt,
      concurrency: r.concurrency,
      totalBytes: r.bytes,
      ecsDurationSec: r.ecsDuration,
      taskCpu: r.taskCpu,
      taskMemory: r.taskMemory,
      percentilesMs: {
        p0: r.p0_0, p50: r.p50_0, p90: r.p90_0, p95: r.p95_0, p99: r.p99_0, p99_9: r.p99_9, p100: r.p100_0,
      },
      responseCodes: r.responseCodes,
      topFailures: r.topFailures,
    },
    awsContext: compactAwsContext(window._lastAwsContext),
  };

  const systemPrompt = cfg.systemPrompt ||
    '你是一位资深 AWS 性能工程师和压测分析专家。请根据提供的分布式压测结果和 AWS 基础设施指标，给出结构化分析报告。\n\n' +
    '## 输出格式（严格按以下 5 部分输出）\n\n' +
    '### 1. 执行摘要\n' +
    '2-3 句话概括：是否达标、主要瓶颈、最紧急的问题。\n\n' +
    '### 2. 关键指标解读\n' +
    '用表格展示核心指标（吞吐量/RPS、成功率、p50/p95/p99 响应时间）。\n' +
    '标注异常：p99 > 2×p50 表示长尾延迟严重；5xx > 1% 说明服务端不稳定；p95 > 1s 需关注。\n' +
    '如有 AWS 指标，交叉对比：ELB 请求数 vs 压测请求数、ELB 响应时间 vs 客户端测量值。\n\n' +
    '### 3. 失败分析\n' +
    '分析 topFailures 中的错误信息和响应码分布。区分客户端错误(4xx)和服务端错误(5xx)。\n' +
    '如果失败率 > 0.1%，给出根因判断（连接超时？后端 OOM？限流？配置问题？）。\n\n' +
    '### 4. 瓶颈定位\n' +
    '结合 AWS 指标（如有）进行判断：\n' +
    '- CPU > 80% → CPU 瓶颈，建议扩容或优化\n' +
    '- UnHealthyHostCount > 0 → 实例故障\n' +
    '- ELB 5xx vs Target 5xx → 区分负载均衡层和后端问题\n' +
    '- 网络流量趋势是否接近饱和\n' +
    '- 注意 _alerts 字段中的预警信号\n' +
    '没有 AWS 上下文数据时跳过此部分。\n\n' +
    '### 5. 优化建议（按优先级排列）\n' +
    '每条建议格式：**问题** → **建议** → **预期效果**\n' +
    '从最高优先级（影响最大、成本最低）开始。区分短期修复和长期优化。\n\n' +
    '## 规则\n' +
    '- 用中文回答，数据精确引用原始数值\n' +
    '- 对比数据用表格展示';

  const payload = {
    baseUrl: cfg.baseUrl,
    apiKey: cfg.apiKey,
    model: cfg.model,
    temperature: cfg.temperature != null ? cfg.temperature : 0.2,
    messages: [
      { role: 'system', content: systemPrompt },
      { role: 'user', content: '请分析以下压测结果：\n```json\n' + JSON.stringify(summary, null, 2) + '\n```' },
    ],
  };

  // 直连 LLM 流式（浏览器 → LLM API，不走后端代理）
  try {
    await directStreamLlm(payload, infoBar, out, d.testId);
  } catch (e) {
    infoBar.textContent = '浏览器直连未成功，正在通过后端代理分析（可能需要 20-30 秒）...';
    try { await syncAiAnalysis(payload, infoBar, out, d.testId); }
    catch (e2) { out.innerHTML = ''; body.appendChild(el('div', { class: 'error' }, 'AI 分析失败：' + e2.message + '。请在设置页检查 LLM 配置（API 地址、密钥、模型名称）是否正确。')); }
  }
}

// 浏览器直连 LLM 的 /chat/completions（stream: true），解析 SSE
async function directStreamLlm(payload, infoBar, outEl, testId) {
  const started = performance.now();
  let tokenCount = 0;
  let fullContent = '';
  infoBar.innerHTML = '';
  infoBar.appendChild(el('span', { class: 'ai-spinner' }));
  infoBar.appendChild(el('span', {}, '正在连接 LLM，分析可能需要 30-60 秒，请稍候...'));

  let url = (payload.baseUrl || '').replace(/\/+$/, '');
  if (url.endsWith('/chat/completions')) { /* already full */ }
  else if (url.endsWith('/v1')) url += '/chat/completions';
  else url += '/v1/chat/completions';

  const resp = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + payload.apiKey,
    },
    body: JSON.stringify({
      model: payload.model,
      messages: payload.messages,
      temperature: payload.temperature ?? 0.2,
      max_tokens: 4096,
      stream: true,
    }),
  });

  if (!resp.ok) {
    const errText = await resp.text().catch(() => '');
    throw new Error(`[${resp.status}] ${errText.slice(0, 500)}`);
  }
  if (!resp.body) throw new Error('浏览器不支持 ReadableStream');

  infoBar.innerHTML = '<span class="ai-pulse-dot streaming"></span><span>流式输出中...</span>';
  outEl.classList.add('ai-output');
  const reader = resp.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buf = '';
  let model = payload.model;
  let usage = null;
  let renderTimer = null;

  let followTail = true;
  let programmaticScroll = false;
  outEl.classList.add('streaming');
  const onContainerScroll = () => {
    if (programmaticScroll) { programmaticScroll = false; return; }
    const atBottom = outEl.scrollHeight - outEl.scrollTop - outEl.clientHeight < 40;
    followTail = atBottom;
  };
  outEl.addEventListener('scroll', onContainerScroll, { passive: true });

  const renderMd = () => {
    if (typeof marked !== 'undefined' && marked.parse) {
      outEl.innerHTML = marked.parse(fullContent);
    } else {
      outEl.textContent = fullContent;
    }
    if (followTail) {
      programmaticScroll = true;
      outEl.scrollTop = outEl.scrollHeight;
    }
  };

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, idx).trim();
      buf = buf.slice(idx + 1);
      if (!line || line === 'data: [DONE]') continue;
      if (!line.startsWith('data:')) continue;
      const jsonStr = line.slice(5).trim();
      if (!jsonStr || jsonStr === '[DONE]') continue;
      let ev;
      try { ev = JSON.parse(jsonStr); } catch { continue; }
      if (ev.model) model = ev.model;
      if (ev.usage) usage = ev.usage;
      const delta = ev.choices && ev.choices[0] && ev.choices[0].delta && ev.choices[0].delta.content;
      if (typeof delta === 'string' && delta.length > 0) {
        fullContent += delta;
        tokenCount += 1;
        // Throttle re-render to every 100ms for performance
        if (!renderTimer) {
          renderTimer = setTimeout(() => { renderMd(); renderTimer = null; }, 100);
        }
        if (tokenCount % 10 === 0) {
          const elapsed = ((performance.now() - started) / 1000).toFixed(1);
          infoBar.innerHTML = `<span class="ai-pulse-dot streaming"></span><span>流式输出中 · ${tokenCount} tokens · ${elapsed}s</span>`;
        }
      }
    }
  }
  // Final render
  outEl.removeEventListener('scroll', onContainerScroll);
  outEl.classList.remove('streaming');
  if (renderTimer) { clearTimeout(renderTimer); }
  followTail = true;
  renderMd();
  _lastAiContent = fullContent;
  const elapsed = ((performance.now() - started) / 1000).toFixed(1);
  const pt = usage && usage.prompt_tokens;
  const ct = usage && usage.completion_tokens;
  outEl.classList.remove('ai-streaming');
  let statsText = `模型 ${model} · 耗时 ${elapsed}s${pt!=null?` · tokens ${pt}+${ct}`:''}`
  infoBar.className = 'ai-status-bar done';
  infoBar.innerHTML = `<span class="ai-done-icon">✓</span><span>${statsText}</span>`;
  if (testId && fullContent) {
    api('PUT', '/scenarios/' + testId, { aiAnalysis: fullContent })
      .then(() => { infoBar.innerHTML = `<span class="ai-done-icon">✓</span><span>${statsText} · 已自动保存</span>`; })
      .catch(e => console.warn('Save aiAnalysis failed:', e));
  }
}

async function syncAiAnalysis(payload, infoBar, outEl, testId) {
  infoBar.innerHTML = '';
  infoBar.appendChild(el('span', { class: 'ai-spinner' }));
  infoBar.appendChild(el('span', {}, '同步分析中（可能需要 5-30 秒）...'));
  const resp = await api('POST', '/ai-analyze', payload);
  _lastAiContent = resp.content || '';
  outEl.classList.add('ai-output');
  if (typeof marked !== 'undefined' && marked.parse) {
    outEl.innerHTML = marked.parse(resp.content || '(空响应)');
  } else {
    outEl.textContent = resp.content || '(空响应)';
  }
  let statsText = `完成 · 模型: ${resp.model} · tokens: prompt=${(resp.usage && resp.usage.prompt_tokens) || '-'} completion=${(resp.usage && resp.usage.completion_tokens) || '-'}`;
  infoBar.textContent = statsText;
  if (testId && _lastAiContent) {
    api('PUT', '/scenarios/' + testId, { aiAnalysis: _lastAiContent })
      .then(() => { infoBar.textContent = statsText + ' · ✓ 已自动保存'; })
      .catch(e => console.warn('Save aiAnalysis failed:', e));
  }
}

function compactAwsContext(ctx) {
  if (!ctx) return null;
  const slim = (m) => m ? { avg: +m.avg.toFixed(3), max: +m.max.toFixed(3), sum: +m.sum.toFixed(3) } : null;
  const result = {
    host: ctx.host,
    elb: ctx.elb ? {
      name: ctx.elb.name, type: ctx.elb.type,
      metrics: Object.fromEntries(Object.entries(ctx.elb.metrics || {}).map(([k,v]) => [k, slim(v)])),
    } : null,
    targetGroups: (ctx.targetGroups || []).map(tg => ({
      name: tg.name,
      protocol: `${tg.protocol}:${tg.port}`,
      targetType: tg.targetType,
      targetCount: (tg.targets || []).length,
      healthyCount: (tg.targets || []).filter(t => t.state === 'healthy').length,
      unhealthySample: (tg.targets || []).filter(t => t.state !== 'healthy').slice(0, 3).map(t => ({ id: t.id, state: t.state, desc: t.description || t.reason })),
      metrics: Object.fromEntries(Object.entries(tg.metrics || {}).map(([k,v]) => [k, slim(v)])),
    })),
    instances: (ctx.instances || []).map(inst => {
      const slimEbs = {};
      for (const vid in (inst.ebsMetrics || {})) {
        const em = inst.ebsMetrics[vid] || {};
        slimEbs[vid] = Object.fromEntries(Object.entries(em).map(([k,v]) => [k, slim(v)]));
      }
      return {
        id: inst.instanceId, name: inst.name, type: inst.instanceType,
        metrics: Object.fromEntries(Object.entries(inst.metrics || {}).map(([k,v]) => [k, slim(v)])),
        volumes: inst.volumes || [],
        ebsMetrics: slimEbs,
      };
    }),
  };
  const alerts = [];
  if (result.elb && result.elb.metrics) {
    const m = result.elb.metrics;
    if (m.HTTPCode_ELB_5XX_Count && m.HTTPCode_ELB_5XX_Count.sum > 0) alerts.push('ELB_5xx=' + m.HTTPCode_ELB_5XX_Count.sum);
    if (m.HTTPCode_Target_5XX_Count && m.HTTPCode_Target_5XX_Count.sum > 0) alerts.push('Target_5xx=' + m.HTTPCode_Target_5XX_Count.sum);
    if (m.RejectedConnectionCount && m.RejectedConnectionCount.sum > 0) alerts.push('RejectedConn=' + m.RejectedConnectionCount.sum);
  }
  for (const inst of result.instances || []) {
    const cpu = inst.metrics && inst.metrics.CPUUtilization;
    if (cpu && cpu.max > 80) alerts.push(inst.id + '_CPU_max=' + cpu.max + '%');
    if (cpu && cpu.avg > 70) alerts.push(inst.id + '_CPU_avg=' + cpu.avg + '%');
  }
  for (const tg of result.targetGroups || []) {
    if (tg.healthyCount < tg.targetCount) alerts.push(tg.name + '_unhealthy=' + (tg.targetCount - tg.healthyCount));
  }
  if (alerts.length) result._alerts = alerts;
  return result;
}

function healthBanner(successRate, p99Ms, failCount, topFailures) {
  const sr = parseFloat(successRate) || 0;
  let bg, color, icon, text, detail;

    bg = '#e6f4ea'; color = '#1d7a2b'; icon = '✅'; text = '测试通过';
    detail = '成功率 ' + sr.toFixed(1) + '%' + (p99Ms ? ', P99 = ' + p99Ms.toFixed(0) + 'ms' : '');
  } else if (sr >= 90) {
    bg = '#fff8e1'; color = '#8a6d00'; icon = '⚠️'; text = '需要关注';
    detail = '成功率 ' + sr.toFixed(1) + '%, 失败 ' + failCount;
  } else {
    bg = '#fce8e6'; color = '#b3261e'; icon = '❌'; text = sr === 0 ? '全部失败' : '大量失败';
    const reason = (topFailures && topFailures[0]) ? ' — ' + (topFailures[0].message || '').slice(0, 60) : '';
    detail = '成功率 ' + sr.toFixed(1) + '%, 失败 ' + failCount + reason;
  }
  return el('div', { class: 'health-banner', style: 'background:' + bg + ';color:' + color },
    el('span', { class: 'health-icon' }, icon),

function renderPercentileChart(r, container) {
  const labels = ['P50', 'P90', 'P95', 'P99', 'P99.9', 'P100'];
  const keys = ['p50_0', 'p90_0', 'p95_0', 'p99_0', 'p99_9', 'p100_0'];
  const values = keys.map(k => r[k] ? parseFloat(r[k]) * 1000 : 0);
  const colors = values.map(v => v < 500 ? '#2ca02c' : v < 2000 ? '#f5a623' : '#d13212');
  const canvas = el('canvas', {});
  container.appendChild(canvas);
  new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{ data: values, backgroundColor: colors, borderRadius: 3, barPercentage: 0.6 }]
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ctx.raw.toFixed(0) + ' ms' } } },
      scales: {
        x: { title: { display: true, text: 'ms' }, grid: { color: '#f0f2f5' } },
        y: { grid: { display: false } }
      }
    }
  });
}

function renderCodeDonut(responseCodes, container) {
  const groups = {};
  for (const rc of responseCodes) {
    const c = String(rc.code || '');
    let grp = 'Other';
    if (/^2/.test(c)) grp = '2xx'; else if (/^3/.test(c)) grp = '3xx'; else if (/^4/.test(c)) grp = '4xx'; else if (/^5/.test(c)) grp = '5xx';
    else if (c.includes('Non HTTP')) grp = 'Non-HTTP';
    groups[grp] = (groups[grp] || 0) + (parseInt(rc.count) || 0);
  }
  const palette = { '2xx': '#2ca02c', '3xx': '#1967d2', '4xx': '#f5a623', '5xx': '#d13212', 'Non-HTTP': '#6a737d', 'Other': '#adb5bd' };
  const labels = Object.keys(groups);
  const data = Object.values(groups);
  const colors = labels.map(l => palette[l] || '#adb5bd');
  const canvas = el('canvas', {});
  container.appendChild(canvas);
  new Chart(canvas.getContext('2d'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: '60%',
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, padding: 8, font: { size: 11 } } },
        tooltip: { callbacks: { label: ctx => ctx.label + ': ' + ctx.raw + ' (' + (ctx.raw / data.reduce((a,b)=>a+b,0) * 100).toFixed(1) + '%)' } }
      }
    }
  });
}

function codeColor(code) {
  const c = String(code || '');
  if (/^2/.test(c)) return '#2CA02C';   // 2xx - green
  if (/^3/.test(c)) return '#1967d2';   // 3xx - blue
  if (/^4/.test(c)) return '#f5a623';   // 4xx - amber
  if (/^5/.test(c)) return '#d13212';   // 5xx - red
  return '#6a737d';                     // other / non-HTTP - gray
}

function codeBadge(code) {
  const c = String(code || '');
  if (/^2/.test(c)) return 'b-complete';
  if (/^3/.test(c)) return 'b-scheduled';
  if (/^4/.test(c)) return 'b-running';
  if (/^5/.test(c)) return 'b-failed';
  return 'b-idle';
}

function route(view, arg) {
  document.querySelectorAll('.nav-link').forEach(a => a.classList.toggle('active', a.dataset.view === view));
  const hash = view + (arg ? '/' + encodeURIComponent(arg) : '');
  _currentHash = hash;
  window.location.hash = hash;
  (views[view] || views.list)(arg);
}

document.querySelectorAll('.nav-link[data-view]').forEach(a => {
  a.addEventListener('click', e => { e.preventDefault(); route(a.dataset.view); });
  a.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); route(a.dataset.view); } });
});

// ============ API Key prompt ============
function showApiKeyPrompt(msg) {
  let overlay = document.getElementById('apikey-overlay');
  if (overlay) { if (msg) overlay.querySelector('.apikey-error').textContent = msg; return; }
  overlay = document.createElement('div');
  overlay.id = 'apikey-overlay';
  overlay.innerHTML =
    '<div class="apikey-box">' +
      '<h2>Load Testing Pilot</h2>' +
      '<p>请输入 API Key 以继续使用</p>' +
      '<input id="apikey-input" type="password" placeholder="粘贴 API Key" autocomplete="off">' +
      '<div class="apikey-error"></div>' +
      '<button id="apikey-submit">确认</button>' +
      '<p class="apikey-hint">向管理员获取 API Key（管理员可运行 aws apigateway get-api-key --include-value 查看）</p>' +
    '</div>';
  document.body.appendChild(overlay);
  if (msg) overlay.querySelector('.apikey-error').textContent = msg;
  const inp = document.getElementById('apikey-input');
  const btn = document.getElementById('apikey-submit');
  async function tryKey() {
    const k = inp.value.trim();
    if (!k) { overlay.querySelector('.apikey-error').textContent = '请输入 API Key'; return; }
    btn.disabled = true; btn.textContent = '验证中...';
    try {
      const r = await fetch(API + '/scenarios', { headers: { 'Content-Type': 'application/json', 'x-api-key': k } });
      if (r.status === 403) { overlay.querySelector('.apikey-error').textContent = 'API Key 无效，请检查后重试'; btn.disabled = false; btn.textContent = '确认'; return; }
      setApiKey(k);
      overlay.remove();
      initFromHash();
    } catch { overlay.querySelector('.apikey-error').textContent = '网络连接失败'; btn.disabled = false; btn.textContent = '确认'; }
  }
  btn.onclick = tryKey;
  inp.onkeydown = e => { if (e.key === 'Enter') tryKey(); };
  inp.focus();
}

function initFromHash() {
  const h = window.location.hash.slice(1);
  if (!h) return views.list();
  if (h === _currentHash) return;
  const [view, arg] = h.split('/');
  route(view, arg ? decodeURIComponent(arg) : undefined);
}

window.addEventListener('hashchange', initFromHash);
if (getApiKey()) initFromHash(); else showApiKeyPrompt();
</script>
</body>
