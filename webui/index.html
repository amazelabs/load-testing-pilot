<style>
:root {
  --bg: #f1f4f9; --surface: #fefefe; --surface-hover: #f8fafb;
  --border: #e2e8f0; --border-focus: #f97316;
  --text: #0f172a; --text-2: #475569; --text-3: #64748b;
  --accent: #f97316; --accent-hover: #ea580c; --accent-soft: #fff7ed;
  --danger: #ef4444; --danger-soft: #fef2f2;
  --success: #10b981; --success-soft: #ecfdf5;
  --info: #3b82f6; --info-soft: #eff6ff;
  --warn: #f59e0b; --warn-soft: #fffbeb;
  --navy: #0f172a;
  /* [INLINE] 字体栈: 系统中文字体，无外网依赖 */
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Hiragino Sans GB", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Consolas, "Microsoft YaHei UI", "Liberation Mono", monospace;
  --radius: 10px; --radius-sm: 6px; --radius-lg: 14px;
  --shadow: 0 1px 3px rgba(15,23,42,.04), 0 1px 2px rgba(15,23,42,.06);
  --shadow-md: 0 4px 12px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.08);
  --shadow-lg: 0 10px 30px rgba(15,23,42,.08), 0 4px 8px rgba(15,23,42,.04);
  --transition: 180ms cubic-bezier(.4,0,.2,1);
}
@keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }
@keyframes spin { to { transform:rotate(360deg) } }
@keyframes fadeUp { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
@keyframes slideIn { from { opacity:0; transform:translateY(-12px) } to { opacity:1; transform:none } }

/* ── Reset & Base ──────────────────────────────────────────── */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }
body { font-family:var(--font); background:var(--bg); color:var(--text); font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased }

/* ── Header ────────────────────────────────────────────────── */
header {
  background: var(--navy);
  color: white;
  padding: 0 32px;
  height: 52px;
  display: flex;
  align-items: center;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 0 rgba(255,255,255,.05), var(--shadow-md);
}
header h1 { font-size: 15px; font-weight: 700; letter-spacing: -.02em; display: inline-block; }
header .subtitle { font-size: 11px; opacity: .45; margin-left: 14px; font-weight: 500; letter-spacing: .03em; text-transform: uppercase; }

/* ── Nav ───────────────────────────────────────────────────── */
nav {
  background: var(--surface);
  padding: 0 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 2px;
  position: sticky; top: 52px; z-index: 99;
}
nav a {
  display: inline-flex; align-items: center;
  padding: 11px 18px;
  color: var(--text-2);
  text-decoration: none;
  font-size: 13px; font-weight: 600;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color var(--transition), border-color var(--transition);
}
nav a:hover { color: var(--text); }
nav a.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── Content ───────────────────────────────────────────────── */
main { max-width: 1320px; margin: 0 auto; padding: 28px 32px; }

/* ── Cards ─────────────────────────────────────────────────── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 24px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
  animation: fadeUp .35s ease both;
  transition: box-shadow var(--transition);
}
.card.clickable:hover { box-shadow: var(--shadow-md); }
.card h2 { font-size: 13px; margin-bottom: 16px; color: var(--text); font-weight: 700; }

/* ── Buttons ───────────────────────────────────────────────── */
button {
  padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 600;
  font-family: var(--font); color: var(--text);
  transition: all var(--transition);
  display: inline-flex; align-items: center; gap: 6px;
}
button:hover:not(:disabled) { background: var(--surface-hover); border-color: #cbd5e1; box-shadow: var(--shadow); }
button.primary { background: var(--accent); color: white; border-color: var(--accent); }
button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); box-shadow: 0 2px 8px rgba(249,115,22,.3); }
button.danger { background: var(--danger); color: white; border-color: var(--danger); }
button.danger:hover:not(:disabled) { background: #dc2626; box-shadow: 0 2px 8px rgba(239,68,68,.3); }
button:disabled { opacity: .4; cursor: not-allowed; }
button + button { margin-left: 8px; }
.flex-right button + button, .confirm-actions button + button { margin-left: 0; }

/* ── Form Controls ─────────────────────────────────────────── */
input[type=text],input[type=number],input[type=password],textarea,select,input[type=file] {
  width: 100%; padding: 9px 12px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 13px; font-family: var(--font); color: var(--text);
  background: var(--surface);
  transition: border-color var(--transition), box-shadow var(--transition);
}
input:focus,textarea:focus,select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(249,115,22,.1); }
textarea { min-height: 100px; font-family: var(--mono); font-size: 12px; line-height: 1.6; }
label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--text-2); font-size: 12px; letter-spacing: .02em; }
.row { margin-bottom: 14px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }

/* ── Tables ────────────────────────────────────────────────── */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 10px 14px; background: var(--bg); font-weight: 700; font-size: 11px; color: var(--text-3); border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .05em; }
td { padding: 12px 14px; border-bottom: 1px solid var(--border); transition: background var(--transition); }
tr:hover td { background: var(--accent-soft); }

/* ── Badges ────────────────────────────────────────────────── */
.badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: .03em; }
.b-running { background: var(--warn-soft); color: #b45309; }
.b-complete,.b-completed { background: var(--success-soft); color: #047857; }
.b-failed,.b-cancelled { background: var(--danger-soft); color: #b91c1c; }
.b-scheduled,.b-cancelling { background: var(--info-soft); color: #1d4ed8; }
.b-idle { background: #f1f5f9; color: var(--text-3); }

/* ── Feedback ──────────────────────────────────────────────── */
.muted { color: var(--text-3); font-size: 12px; }
.error { background: var(--danger-soft); color: #b91c1c; padding: 14px 18px; border-radius: var(--radius); margin-bottom: 16px; border: 1px solid #fecaca; font-size: 13px; }
.success { background: var(--success-soft); color: #047857; padding: 14px 18px; border-radius: var(--radius); margin-bottom: 16px; border: 1px solid #a7f3d0; font-size: 13px; }
.toast-msg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 14px 28px; border-radius: var(--radius); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); max-width: 80vw; animation: slideIn .3s ease; backdrop-filter: blur(8px); }
.toast-error { background: rgba(239,68,68,.95); color: white; }
.toast-success { background: rgba(16,185,129,.95); color: white; }

/* ── Confirm Dialog ───────────────────────────────────────── */
.confirm-overlay { position:fixed; inset:0; z-index:10000; background:rgba(15,23,42,.45); display:flex; align-items:center; justify-content:center; animation:fadeIn .15s ease }
.confirm-box { background:var(--surface); border-radius:var(--radius-lg); padding:28px 32px; max-width:460px; width:90vw; box-shadow:0 20px 60px rgba(0,0,0,.18); }
.confirm-box h3 { font-size:15px; font-weight:700; margin-bottom:12px; color:var(--text); }
.confirm-box p { font-size:13px; color:var(--text-2); line-height:1.6; margin-bottom:6px; }
.confirm-box .confirm-detail { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 16px; margin:12px 0 18px; font-size:13px; }
.confirm-box .confirm-detail dt { color:var(--text-3); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
.confirm-box .confirm-detail dd { color:var(--text); font-weight:600; margin:0 0 8px; }
.confirm-box .confirm-detail dd:last-child { margin-bottom:0; }
.confirm-box .confirm-warn { font-size:12px; color:#b45309; background:var(--warn-soft); padding:8px 12px; border-radius:var(--radius-sm); margin-bottom:16px; }
.confirm-box .confirm-actions { display:flex; justify-content:flex-end; gap:8px; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.field-error { border-color: var(--danger) !important; box-shadow: 0 0 0 3px rgba(239,68,68,.1) !important; }
.field-hint { font-size:11px; color:var(--danger); margin-top:3px; }

/* ── Spinner ───────────────────────────────────────────────── */
.ai-spinner { display:inline-block; width:16px; height:16px; border:2.5px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0 }

/* ── Credentials Panel ─────────────────────────────────────── */
.cred-toggle { cursor:pointer; user-select:none; color:var(--accent); font-size:13px; font-weight:600; margin:8px 0 }
.cred-toggle:hover { text-decoration:underline }
.cred-body { padding:16px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:14px }
.cred-body label { display:block; margin:8px 0 4px; font-size:13px; color:var(--text-2) }
.cred-body input[type=text],.cred-body input[type=password] { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:13px }
.cred-body .radio-group label { display:inline-flex; align-items:center; gap:5px; margin-right:18px; font-size:13px; color:var(--text); cursor:pointer }
.cred-body pre { background:var(--surface); border:1px solid var(--border); padding:14px; border-radius:var(--radius-sm); font-size:12px; overflow-x:auto; white-space:pre-wrap; margin:8px 0 }
.cred-body .cred-hint { font-size:12px; color:var(--text-3); margin:6px 0 8px }

/* ── Utility ───────────────────────────────────────────────── */
.hidden { display: none; }
.loading { text-align: center; padding: 60px; color: var(--text-3); font-weight: 500; }
.flex-right { display: flex; justify-content: flex-end; gap: 8px; }
.mono { font-family: var(--mono); font-size: 12px; }

/* ── Metrics ───────────────────────────────────────────────── */
.metric { text-align: center; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
.metric .value { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -.03em; }
.metric .label { font-size: 11px; color: var(--text-3); margin-top: 6px; font-weight: 600; }

/* ── Tabs ──────────────────────────────────────────────────── */
.tab-bar { border-bottom: 1px solid var(--border); margin-bottom: 18px; display: flex; gap: 2px; }
.tab-bar a { display: inline-block; padding: 10px 16px; color: var(--text-3); cursor: pointer; border-bottom: 2px solid transparent; font-size: 13px; font-weight: 600; transition: all var(--transition); }
.tab-bar a:hover { color: var(--text-2); }
.tab-bar a.active { color: var(--text); border-bottom-color: var(--accent); }

/* ── KV Layout ─────────────────────────────────────────────── */
.schedule-radio { display: block; margin-bottom: 8px; }
.schedule-radio input { margin-right: 6px; }
.kv { display: grid; grid-template-columns: 160px 1fr; gap: 10px 16px; font-size: 13px; }
.kv dt { color: var(--text-3); font-weight: 600; font-size: 12px; }
.kv dd { color: var(--text); word-break: break-all; }

/* ── Code & Pre ────────────────────────────────────────────── */
pre { background: var(--bg); border: 1px solid var(--border); padding: 14px; border-radius: var(--radius-sm); overflow-x: auto; font-size: 12px; font-family: var(--mono); }
.alert-warn { background: var(--warn-soft); border: 1px solid #fde68a; padding: 12px 16px; font-size: 13px; margin-bottom: 14px; color: #92400e; border-radius: var(--radius-sm); }

/* ── AI Output ─────────────────────────────────────────────── */
.ai-output { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; font-size: 14px; line-height: 1.75; overflow-x: auto; }
.ai-output.streaming { max-height: 60vh; overflow-y: auto; }
.ai-output::-webkit-scrollbar { width: 6px; }
.ai-output::-webkit-scrollbar-track { background: transparent; }
.ai-output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.ai-output::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
.ai-output h1,.ai-output h2,.ai-output h3 { margin-top: 18px; margin-bottom: 10px; font-weight: 700; color: var(--text); }
.ai-output h2 { font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.ai-output h3 { font-size: 14px; }
.ai-output p { margin-bottom: 10px; color: var(--text); }
.ai-output ul,.ai-output ol { padding-left: 22px; margin-bottom: 10px; }
.ai-output li { margin-bottom: 4px; }
.ai-output table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 13px; }
.ai-output th,.ai-output td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.ai-output th { background: var(--bg); font-weight: 700; color: var(--text-2); }
.ai-output code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 12px; font-family: var(--mono); color: var(--accent-hover); }
.ai-output pre { background: var(--navy); border: none; color: #e2e8f0; padding: 16px; border-radius: var(--radius-sm); margin: 12px 0; }
.ai-output pre:last-child { margin-bottom: 0; }
.ai-output pre code { background: none; padding: 0; color: inherit; }
.ai-output blockquote { border-left: 3px solid var(--accent); padding-left: 14px; color: var(--text-2); margin: 10px 0; }
.ai-output strong { color: var(--text); font-weight: 700; }

/* ── Charts ────────────────────────────────────────────────── */
.chart-container { position: relative; height: 220px; margin-bottom: 18px; }

/* ── Health Banner ─────────────────────────────────────────── */
.health-banner { padding: 16px 22px; border-radius: var(--radius); margin-bottom: 18px; display: flex; align-items: center; gap: 14px; font-weight: 600; }
.health-banner .health-icon { font-size: 22px; }
.health-banner .health-text { font-size: 14px; }
.health-banner .health-detail { font-size: 12px; opacity: .75; margin-left: auto; font-weight: 500; }

/* ── Hero Metrics ──────────────────────────────────────────── */
.hero-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 18px; }
@media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 500px) { .hero-grid { grid-template-columns: 1fr; } }
.hero-metric { text-align: center; padding: 22px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); transition: all var(--transition); }
.hero-metric:hover { box-shadow: var(--shadow-md); border-color: #cbd5e1; }
.hero-metric .hero-value { font-size: 30px; font-weight: 700; line-height: 1.1; color: var(--text); letter-spacing: -.03em; }
.hero-metric .hero-label { font-size: 12px; color: var(--text-3); margin-top: 8px; font-weight: 600; }
.hero-metric .hero-sub { font-size: 11px; color: var(--text-3); margin-top: 3px; }

/* ── Infra Badges ──────────────────────────────────────────── */
.infra-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.infra-badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; font-size: 11px; color: var(--text-2); font-weight: 500; }
.infra-badge b { color: var(--text); font-weight: 700; }

/* ── Results Layout ────────────────────────────────────────── */
.results-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
.results-2col .pct-chart-container { position: relative; height: 200px; }
.code-2col { display: grid; grid-template-columns: 240px 1fr; gap: 22px; align-items: start; }
.donut-wrap { position: relative; width: 220px; height: 220px; }

/* ── Failure Rows ──────────────────────────────────────────── */
.fail-row .fail-cell { max-width: 480px; }
.fail-row .fail-msg { font-size: 12px; color: var(--danger); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; cursor: help; }
.fail-row .fail-url { font-size: 11px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 340px; cursor: help; color: var(--text-2); }
.fail-row:hover .fail-msg { -webkit-line-clamp: unset; display: block; white-space: pre-wrap; }
.fail-row:hover .fail-url { white-space: normal; word-break: break-all; }
.fail-row:hover { background: var(--danger-soft); }

/* ── Scrollbar ─────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

/* ── AI Analysis Card ──────────────────────────────────────── */
.ai-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.ai-card-title { display: flex; align-items: center; gap: 8px; }
.ai-card-title h2 { margin-bottom: 0; }
.ai-card-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--accent);
  color: white; font-size: 14px; flex-shrink: 0;
}
.ai-saved-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 12px; border-radius: 20px;
  background: var(--success-soft); color: #047857;
  font-size: 12px; font-weight: 600; margin-bottom: 10px;
}
.ai-status-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; border-radius: var(--radius-sm);
  background: var(--bg); font-size: 13px; font-weight: 500;
  color: var(--text-2); margin-bottom: 12px;
  transition: all .3s ease;
}
.ai-status-bar.done { background: var(--success-soft); color: #047857; }
.ai-pulse-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
  animation: aiPulse 1.5s ease-in-out infinite;
}
.ai-pulse-dot.streaming { background: var(--success); animation: aiPulse .8s ease-in-out infinite; }
@keyframes aiPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.7); } }
.ai-done-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 50%;
  background: #047857; color: white; font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.ai-streaming { min-height: 100px; position: relative; }
.ai-streaming::after {
  content: '▊'; animation: aiCursor .6s step-end infinite;
  color: var(--accent); font-weight: 700;
}
@keyframes aiCursor { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* ── Detail Sidebar Nav ────────────────────────────────────── */
.detail-sidebar {
  position: fixed; top: 120px; z-index: 90;
  left: max(12px, calc((100vw - 1320px) / 2 - 108px));
  width: 96px;
  display: flex; flex-direction: column; gap: 1px;
}
.detail-sidebar a {
  display: block; padding: 8px 10px;
  font-size: 11px; font-weight: 600; color: var(--text-3);
  text-decoration: none; cursor: pointer;
  border-radius: var(--radius-sm);
  transition: all var(--transition);
  line-height: 1.3;
  white-space: nowrap;
}
.detail-sidebar a:hover { color: var(--text-2); background: var(--surface); }
.detail-sidebar a.active { color: var(--accent); background: var(--accent-soft); }
@media (max-width: 1560px) {
  .detail-sidebar { left: 4px; width: 72px; }
  .detail-sidebar a { padding: 6px 6px; font-size: 10px; }
  body:has(.detail-sidebar) main { margin-left: 80px; margin-right: 0; }
}

/* ── Dashboard ─────────────────────────────────────────────── */
.dash-hero {
  background: linear-gradient(135deg, var(--navy) 0%, #1e293b 60%, #334155 100%);
  border-radius: var(--radius-lg); padding: 36px 40px; margin-bottom: 22px;
  color: white;
}
.dash-hero h2 { font-size: 26px; font-weight: 700; letter-spacing: -.03em; margin-bottom: 6px; }
.dash-hero p { font-size: 14px; opacity: .6; font-weight: 500; }

.dash-stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px;
}
@media (max-width: 900px) { .dash-stats { grid-template-columns: 1fr 1fr; } }
.dash-stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 22px 20px; position: relative; overflow: hidden;
  transition: all var(--transition); cursor: default;
}
.dash-stat { cursor: pointer; }
.dash-stat:hover { box-shadow: var(--shadow-md); border-color: var(--accent); }
.dash-stat.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.dash-stat .ds-num { font-size: 36px; font-weight: 700; letter-spacing: -.04em; line-height: 1; }
.dash-stat .ds-label { font-size: 12px; color: var(--text-2); font-weight: 600; margin-top: 8px; }

.dash-actions {

.dash-section {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
}
.dash-section h3 { font-size: 14px; font-weight: 700; color: var(--text); }
.dash-section a { font-size: 12px; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: none; }

.dash-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 22px; }
@media (max-width: 900px) { .dash-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .dash-grid { grid-template-columns: 1fr; } .dash-stats { grid-template-columns: 1fr 1fr; } }

.dash-test-card {

}

.dash-test-card .dtc-desc { font-size: 12px; color: var(--text-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dash-test-card .dtc-meta { display: flex; gap: 14px; font-size: 11px; color: var(--text-3); margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-weight: 500; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

/* API Key prompt */

.apikey-box { background: #fff; border-radius: 12px; padding: 40px 36px 32px; max-width: 380px; width: 90%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
.apikey-box h2 { margin: 0 0 6px; font-size: 1.3rem; color: #1a1a2e; }

<body>

<header>
  <h1>Load Testing Pilot</h1>
  <span class="subtitle">多引擎压测 · AI 驱动</span>
</header>

<nav role="navigation" aria-label="主导航">
  <a class="nav-link active" data-view="list" tabindex="0">测试场景</a>
  <a class="nav-link" data-view="create" tabindex="0">新建场景</a>
  <a class="nav-link" data-view="settings" tabindex="0">AI 设置</a>
  <a class="nav-link" data-view="about" tabindex="0">关于</a>
  <a class="nav-link nav-key" tabindex="0" title="切换 API Key" onclick="clearApiKey();showApiKeyPrompt()">🔑</a>
</nav>

<main id="app">
  <div class="loading">加载中...</div>
</main>

<script>
'use strict';

const API = (window.LTP_CONFIG && window.LTP_CONFIG.API_URL) || '';
if (!API) {
  document.getElementById('app').innerHTML =
    '<div class="error">config.js 未正确加载。请确认 CloudFormation 部署已完成且通过 ALB 地址访问。</div>';
  throw new Error('no api url');
}

// DynamoDB round-trip converts numbers to strings; restore them
function _fixNums(o) {
  if (o === null || o === undefined) return o;
  if (typeof o === 'string' && /^-?\d+(\.\d+)?$/.test(o) && o.length < 16) return Number(o);
  if (Array.isArray(o)) return o.map(_fixNums);
  if (typeof o === 'object') { const r = {}; for (const k in o) r[k] = _fixNums(o[k]); return r; }
  return o;
}

// ============ API Key ============
function getApiKey() { return localStorage.getItem('ltp_api_key') || ''; }
function setApiKey(k) { localStorage.setItem('ltp_api_key', k); }
function clearApiKey() { localStorage.removeItem('ltp_api_key'); }

// ============ API wrapper ============
const API_ERROR_MAP = {
  400: '请求参数有误',
  401: '未授权，请检查认证配置',
  403: '无权限执行此操作',
  404: '资源不存在',
  409: '操作冲突，请稍后重试',
  429: '请求过于频繁，请稍后重试',
  500: '服务器内部错误',
  502: '网关错误，后端服务可能不可用',
  503: '服务暂时不可用',
};

async function api(method, path, body) {
  const hdrs = { 'Content-Type': 'application/json' };
  const key = getApiKey();
  if (key) hdrs['x-api-key'] = key;
  const opts = { method, headers: hdrs };
  if (body !== undefined) opts.body = JSON.stringify(body);
  let resp;
  try { resp = await fetch(API + path, opts); }
  catch (e) { throw new Error('网络连接失败，请检查网络后重试'); }
  if (resp.status === 403) { clearApiKey(); showApiKeyPrompt('API Key 无效或已过期，请重新输入'); throw new Error('API Key 无效'); }
  const text = await resp.text();
  let data;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!resp.ok) {
    const detail = typeof data === 'string' ? data : (data && data.message) || '';
    const friendly = API_ERROR_MAP[resp.status] || '请求失败';
    throw new Error(detail ? `${friendly}：${detail}` : `${friendly} (HTTP ${resp.status})`);
  }
  return data;
}

// ============ Utils ============
const $ = sel => document.querySelector(sel);
const el = (tag, attrs, ...children) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
  }
  for (const c of children) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
  }
  return e;
};
const fmtTime = t => t ? t.replace('T', ' ').replace(/\.\d+Z$/, '') : '-';
const escape = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Parse Taurus duration string (e.g. "30s", "1m", "2m30s", "1h5m") to seconds
function parseDuration(str) {
  if (!str) return 0;
  str = str.trim();
  if (/^\d+$/.test(str)) return parseInt(str);
  let total = 0;
  const h = str.match(/(\d+)\s*h/); if (h) total += parseInt(h[1]) * 3600;
  const m = str.match(/(\d+)\s*m(?!s)/); if (m) total += parseInt(m[1]) * 60;
  const s = str.match(/(\d+)\s*s/); if (s) total += parseInt(s[1]);
  return total;
}

function showToast(msg, cls, duration) {
  const existing = document.querySelector('.toast-msg');
  if (existing) existing.remove();
  const div = el('div', { class: 'toast-msg ' + cls, role: 'alert' }, msg);
  document.body.appendChild(div);
  setTimeout(() => { if (div.parentNode) div.remove(); }, duration);
}

function showError(msg) { showToast(msg, 'toast-error', 6000); }

function showSuccess(msg) { showToast(msg, 'toast-success', 4000); }

function showConfirm({ title, message, detail, warn, confirmText, confirmClass, cancelText }) {
  return new Promise(resolve => {
    const overlay = el('div', { class: 'confirm-overlay', role: 'dialog', 'aria-modal': 'true' });
    const box = el('div', { class: 'confirm-box' });
    box.appendChild(el('h3', {}, title || '确认操作'));
    if (message) box.appendChild(el('p', {}, message));
    if (detail) {
      const dl = el('dl', { class: 'confirm-detail' });
      for (const [k, v] of detail) { dl.appendChild(el('dt', {}, k)); dl.appendChild(el('dd', {}, String(v))); }
      box.appendChild(dl);
    }
    if (warn) box.appendChild(el('div', { class: 'confirm-warn' }, warn));
    const close = val => { document.removeEventListener('keydown', onKey); overlay.remove(); resolve(val); };
    box.appendChild(el('div', { class: 'confirm-actions' },
      el('button', { onclick: () => close(false) }, cancelText || '取消'),
      el('button', { class: confirmClass || 'primary', onclick: () => close(true) }, confirmText || '确认'),
    ));
    overlay.appendChild(box);
    overlay.addEventListener('click', e => { if (e.target === overlay) close(false); });
    const onKey = e => {
      if (e.key === 'Escape') { close(false); return; }
      if (e.key === 'Tab') {
        const focusable = box.querySelectorAll('button');
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
    const focusTarget = confirmClass === 'danger' ? box.querySelector('.confirm-actions button:first-child') : box.querySelector('.confirm-actions button:last-child');
    focusTarget.focus();
  });
}

let _lastAiContent = '';

function showFileInfo(file) {
  const info = $('#file-info');
  if (!info) return;
  if (!file) { info.textContent = ''; return; }
  const size = file.size < 1024 ? file.size + ' B'
    : file.size < 1024 * 1024 ? (file.size / 1024).toFixed(1) + ' KB'
    : (file.size / 1024 / 1024).toFixed(1) + ' MB';
  info.textContent = '\u{1F4CE} ' + file.name + ' (' + size + ')';
}

// ============ Views ============
const views = {};

// -------- List view --------
views.list = async function () {
  const app = $('#app');
  app.innerHTML = '';

  // Hero
  app.appendChild(el('div', { class: 'dash-hero' },
    el('h2', {}, 'Load Testing Pilot'),
    el('p', {}, '多压测引擎支持 · 自然语言生成脚本 · AI 智能分析')
  ));

  // Stats placeholders
  app.appendChild(el('div', { class: 'dash-stats', id: 'dash-stats' },
    ...[0,1,2,3].map(() => el('div', { class: 'dash-stat', style: 'min-height:90px' }))
  ));

  // Quick actions
  const goCreate = (tab) => { window._pendingTab = tab; route('create'); };
  app.appendChild(el('div', { class: 'dash-actions' },
    el('div', { class: 'dash-action da-simple', onclick: () => goCreate('simple') },
      el('div', { class: 'da-icon' }, '⚡'),
      el('div', {},
        el('div', {}, '快速 HTTP 测试'),
        el('div', { class: 'da-desc' }, '填写 URL 和参数即可开始'))
    ),
    el('div', { class: 'dash-action da-script', onclick: () => goCreate('jmeter') },
      el('div', { class: 'da-icon' }, '📜'),
      el('div', {},
        el('div', {}, '上传 JMeter 脚本'),
        el('div', { class: 'da-desc' }, '使用已有 .jmx / .py / .js 脚本'))
    ),
    el('div', { class: 'dash-action da-mcp', onclick: () => goCreate('mcp') },
      el('div', { class: 'da-icon' }, '🤖'),
      el('div', {},
        el('div', {}, 'AI 生成脚本'),
        el('div', { class: 'da-desc' }, '用自然语言描述需求，AI 自动生成压测脚本'))
    )
  ));

  // Recent tests section
  app.appendChild(el('div', { class: 'dash-section' },
    el('h3', {}, '最近的测试'),
    el('a', { id: 'dash-showall' }, '')
  ));
  app.appendChild(el('div', { id: 'dash-cards', class: 'dash-grid' },
    el('div', { class: 'loading' }, '加载中...')
  ));

  // Full list (hidden by default)
  app.appendChild(el('div', { id: 'dash-full', style: 'display:none' },
    el('div', { class: 'card' },
      el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:14px' },
        el('h2', {}, '全部测试'),
        el('button', { onclick: () => { const f=$('#dash-full'); f.style.display='none'; } }, '收起')
      ),
      el('div', { id: 'list-body' })
    )
  ));

  try {
    const data = await api('GET', '/scenarios');
    const items = (data && data.Items) || [];

    // Compute stats
    const total = items.length;
    const running = items.filter(i => i.status === 'running').length;
    const complete = items.filter(i => i.status === 'complete').length;
    const failed = items.filter(i => i.status === 'failed' || i.status === 'cancelled').length;

    $('#dash-stats').innerHTML = '';
    const filterByStatus = (statusFilter) => {
      const full = $('#dash-full'); full.style.display = '';
      const showAll = $('#dash-showall'); if (showAll) showAll.style.display = 'none';
      const rows = full.querySelectorAll('tbody tr');
      rows.forEach(row => {
        if (!statusFilter) { row.style.display = ''; return; }
        const badge = row.querySelector('.badge');
        const s = badge ? badge.textContent.trim() : '';
        const match = statusFilter === 'running' ? s === 'running'
          : statusFilter === 'complete' ? s === 'complete'
          : statusFilter === 'failed' ? (s === 'failed' || s === 'cancelled')
          : true;
        row.style.display = match ? '' : 'none';
      });
      const title = full.querySelector('h2');
      if (title) title.textContent = statusFilter ? '全部测试（筛选：' + { running: '运行中', complete: '已完成', failed: '失败' }[statusFilter] + '）' : '全部测试';
      document.querySelectorAll('.dash-stat').forEach(s => s.classList.remove('active'));
      if (statusFilter) { const active = full.closest('main').querySelector('.ds-' + statusFilter); if (active) active.classList.add('active'); }
      else { const active = full.closest('main').querySelector('.ds-total'); if (active) active.classList.add('active'); }
      full.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    const mkStat = (num, label, cls, filter) => el('div', { class: 'dash-stat ' + cls, onclick: () => filterByStatus(filter) },
      el('div', { class: 'ds-num' }, String(num)),
      el('div', { class: 'ds-label' }, label),
      el('div', { class: 'ds-bar' })
    );
    $('#dash-stats').appendChild(mkStat(total, '总测试场景', 'ds-total', null));
    $('#dash-stats').appendChild(mkStat(running, '运行中', 'ds-running', 'running'));
    $('#dash-stats').appendChild(mkStat(complete, '已完成', 'ds-complete', 'complete'));
    $('#dash-stats').appendChild(mkStat(failed, '失败', 'ds-failed', 'failed'));

    // Recent cards (top 6)
    const cardsEl = $('#dash-cards');
    cardsEl.innerHTML = '';
    if (items.length === 0) {
      cardsEl.innerHTML = '<div class="muted" style="text-align:center;padding:40px;grid-column:1/-1">还没有测试场景，点击上方快速创建一个。</div>';
    } else {
      const recent = items.slice(0, 6);
      recent.forEach(item => {
        const card = el('div', { class: 'dash-test-card', onclick: () => route('detail', item.testId) },
          el('div', { class: 'dtc-head' },
            el('div', { class: 'dtc-name' }, item.testName || item.testId),
            el('span', { class: 'badge b-' + (item.status || 'idle') }, item.status || '-')
          ),
          item.testDescription ? el('div', { class: 'dtc-desc' }, item.testDescription) : null,
          el('div', { class: 'dtc-meta' },
            el('span', {}, '🕐 ' + (fmtTime(item.startTime) || '-')),
            el('span', { class: 'mono' }, item.testId)
          )
        );
        cardsEl.appendChild(card);
      });

      if (items.length > 6) {
        const showAll = $('#dash-showall');
        showAll.textContent = '查看全部 ' + items.length + ' 个 →';
        showAll.onclick = () => { $('#dash-full').style.display = ''; showAll.style.display = 'none'; };
      }
    }

    // Full table (lazy)
    const body = $('#list-body');
    body.innerHTML = '';
    if (items.length > 0) {
      const tbl = el('table', {},
        el('thead', {}, el('tr', {},
          el('th', {}, '名称'),
          el('th', {}, '状态'),
          el('th', {}, '最近开始时间'),
          el('th', {}, '测试ID'),
          el('th', { style: 'width:200px' }, '操作')
        )),
        el('tbody', {}, ...items.map(item => el('tr', {},
          el('td', {}, el('a', { style: 'cursor:pointer;color:var(--accent)', onclick: () => route('detail', item.testId) }, item.testName || '-'), el('div', { class: 'muted' }, item.testDescription || '')),
          el('td', {}, el('span', { class: 'badge b-' + (item.status || 'idle') }, item.status || '-')),
          el('td', {}, fmtTime(item.startTime)),
          el('td', {}, el('span', { class: 'mono' }, item.testId)),
          el('td', {},
            el('button', { onclick: () => route('detail', item.testId) }, '详情'),
            el('button', { class: 'danger', onclick: () => deleteScenario(item.testId, item.testName) }, '删除')
          )
        )))
      );
      body.appendChild(tbl);
    }
  } catch (e) {
    $('#dash-cards').innerHTML = `<div class="error">${escape(e.message)}</div>`;
  }
};

async function deleteScenario(testId, name) {
  if (!await showConfirm({ title: '删除场景', message: `确定删除 "${name}"？所有测试运行历史也会被删除，此操作不可恢复。`, confirmText: '删除', confirmClass: 'danger' })) return;
  try {
    await api('DELETE', `/scenarios/${testId}`);
    showSuccess('已删除');
    views.list();
  } catch (e) {
    showError(e.message);
  }
}

// -------- Create view --------
views.create = async function () {
  const app = $('#app');
  app.innerHTML = '';
  app.appendChild(el('div', { class: 'card' }, el('h2', {}, '新建测试场景'),
    el('div', { id: 'form' })
  ));

  // 从 API URL 解析出部署所在的 region（例如 https://xxx.execute-api.cn-north-1.amazonaws.com.cn/prod -> cn-north-1）
  const regionMatch = API.match(/execute-api\.([^.]+)\./);
  const defaultRegion = regionMatch ? regionMatch[1] : 'cn-north-1';

  const form = $('#form');
  form.appendChild(el('div', { class: 'row' },
    el('label', {}, '场景名称'),
    el('input', { type: 'text', id: 'f-name', required: true })
  ));
  form.appendChild(el('div', { class: 'row' },
    el('label', {}, '描述'),
    el('input', { type: 'text', id: 'f-desc' })
  ));

  form.appendChild(el('div', { id: 'taurus-params' },
    el('div', { class: 'grid-2' },
      el('div', { class: 'row' },
        el('label', {}, '容器数量（每个 Fargate 容器模拟一批用户）'),
        el('input', { type: 'number', id: 'f-taskcount', value: 1, min: 1 })
      ),
      el('div', { class: 'row' },
        el('label', {}, '每容器并发用户数'),
        el('input', { type: 'number', id: 'f-concurrency', value: 10, min: 1 })
      )
    ),
    el('div', { class: 'grid-2' },
      el('div', { class: 'row' },
        el('label', {}, '爬升时间（流量逐渐增加，如 30s）'),
        el('input', { type: 'text', id: 'f-rampup', value: '30s' })
      ),
      el('div', { class: 'row' },
        el('label', {}, '正式压测时长（如 5m、10m）'),
        el('input', { type: 'text', id: 'f-holdfor', value: '1m' })
      )
    ),
    el('div', { class: 'row' },
      el('label', {}, '目标吞吐量（每容器每秒请求数 RPS，留空则不限速）'),
      el('input', { type: 'number', id: 'f-throughput', placeholder: '如 500', min: 0, step: 'any', style: 'max-width:240px' })
    )
  ));

  // Test type tabs
  form.appendChild(el('div', { class: 'row' }, el('label', {}, '测试类型')));
  form.appendChild(el('div', { class: 'tab-bar' },
    el('a', { class: 'active', 'data-type': 'simple', onclick: switchType }, 'Simple HTTP'),
    el('a', { 'data-type': 'jmeter', onclick: switchType }, 'JMeter'),

const JMETER_SYSTEM_PROMPT =
  '你是一位 JMeter + Taurus 压测专家。根据用户的自然语言描述，生成 Taurus 执行参数和 JMeter .jmx 脚本。\n\n' +
  '## 输出要求\n\n' +
  '### 1. 执行参数（必须，JSON 代码块）\n' +
  '```json\n{"taskCount": 1, "concurrency": 10, "rampUp": "30s", "holdFor": "5m"}\n```\n' +
  '参数说明：\n' +
  '- taskCount: Fargate 容器数（每容器 2vCPU/4GB）\n' +
  '- concurrency: 每容器并发虚拟用户数（单容器建议不超过 500）\n' +
  '- rampUp: 爬升时间（如 "30s"、"2m"）\n' +
  '- holdFor: 持续时间（如 "5m"、"10m"）\n' +
  '- throughput: 可选，每容器每秒目标请求数（RPS）。仅当用户明确要求 RPS 限速时才设置\n\n' +
  '**RPS 映射规则**：\n' +
  '如果用户要求 N RPS，则设 taskCount 和 concurrency 使总并发数能支撑 N RPS，同时设 throughput = N / taskCount。\n' +
  '例如：用户要 1000 RPS → taskCount=2, concurrency=100, throughput=500\n' +
  '如果用户没有明确指定，使用合理默认值并在说明中注明。\n\n' +
  '### 2. JMeter 脚本（必须，xml 代码块）\n' +
  '完整 .jmx 文件规则：\n' +
  '- ThreadGroup 线程数=1、循环=-1（Taurus 会覆盖这些值）\n' +
  '- 添加 HTTP Request Sampler（URL/方法/Headers/Body）、Header Manager 等\n' +
  '- **禁止添加 ResponseAssertion 或任何 Assertion 元素**。Taurus 自动根据 HTTP 状态码判断成功/失败（2xx=成功，4xx/5xx=失败），JMeter 断言会因字段名格式问题导致所有请求被误判为失败\n' +
  '- **禁止添加 ConstantThroughputTimer、ThroughputShapingTimer 或任何吞吐量控制 Timer**。RPS 控制由 Taurus throughput 参数完成，在 JMX 中加 Timer 会导致进程无法正常退出\n' +
  '- **禁止添加孤立的 `<hashTree/>`**。JMX 格式要求每个测试元素后紧跟一个 hashTree，严格成对。不要添加没有前置元素的空 hashTree（如"监听器占位"），否则 JMeter 无法解析 XML 会直接崩溃\n' +
  '- 可添加 Constant Timer（固定思考时间）、Gaussian Random Timer 等延时 Timer\n' +
  '- 端口非 80/443 时需设 HTTPSampler.port\n\n' +
  '### 3. 简要说明（在代码块之前，2-3 句中文）\n\n' +
  '## 关键规则\n' +
  '- **用户没提供目标地址时，不生成脚本，提示补充目标信息**\n' +
  '- JSON 参数块必须在 XML 代码块之前\n' +
  '- **绝对不要在 JMX 中添加 ConstantThroughputTimer**';

async function generateJmeterScript() {
  const cfg = getLlmConfig();
  if (!cfg || !cfg.baseUrl || !cfg.apiKey) {
    showError('请先在设置页配置 LLM（API 地址和密钥）');
    return;
  }
  const prompt = ($('#f-prompt') || {}).value || '';
  if (!prompt.trim()) { showError('请输入压测需求描述'); return; }

  const outDiv = $('#mcp-output');
  const infoBar = $('#mcp-info');
  const respEl = $('#mcp-response');
  const scriptEl = $('#f-generated-script');
  const btn = $('#btn-generate');
  outDiv.style.display = '';
  respEl.innerHTML = '';
  scriptEl.value = '';
  if (btn) btn.disabled = true;

  const payload = {
    baseUrl: cfg.baseUrl, apiKey: cfg.apiKey, model: cfg.model,
    temperature: cfg.temperature != null ? cfg.temperature : 0.3,
    messages: [
      { role: 'system', content: JMETER_SYSTEM_PROMPT },
      { role: 'user', content: prompt },
    ],
  };

  const extractResults = (raw) => {
    // Extract JSON params block
    const jm = raw.match(/```json\s*([\s\S]*?)```/);
    let params = { taskCount: 1, concurrency: 10, rampUp: '30s', holdFor: '1m' };
    if (jm) { try { params = { ...params, ...JSON.parse(jm[1].trim()) }; } catch {} }
    // Extract XML script block
    let script = '';
    const xm = raw.match(/```xml\s*([\s\S]*?)```/);
    if (xm) {
      script = xm[1].trim();
    } else if (raw.includes('<?xml')) {
      const start = raw.indexOf('<?xml');
      const end = raw.lastIndexOf('</jmeterTestPlan>');
      script = end > start ? raw.slice(start, end + '</jmeterTestPlan>'.length) : raw.slice(start);
    }
    return { params, script };
  };

  const showParams = (params) => {
    window._mcpParams = params;
    const box = $('#mcp-params');
    if (!box) return;
    box.style.display = '';
    box.innerHTML = '';
    box.appendChild(el('strong', { style: 'display:block;margin-bottom:6px' }, '📊 执行参数（可修改）'));
    const grid = el('div', { class: 'grid-2', style: 'gap:8px' });
    const mkInput = (label, id, val) => el('div', {},
      el('label', { style: 'font-size:12px;color:#586069' }, label),
      el('input', { type: 'text', id, value: String(val), style: 'padding:4px 8px;font-size:13px' }));
    grid.appendChild(mkInput('容器数量', 'mcp-taskcount', params.taskCount));
    grid.appendChild(mkInput('每 Task 并发', 'mcp-concurrency', params.concurrency));
    grid.appendChild(mkInput('爬升时间', 'mcp-rampup', params.rampUp));
    grid.appendChild(mkInput('正式压测时长', 'mcp-holdfor', params.holdFor));
    box.appendChild(grid);
    if (params.throughput) {
      box.appendChild(el('div', { style: 'margin-top:6px' },
        mkInput('每 Task RPS 限速 (throughput)', 'mcp-throughput', params.throughput)));
    }
  };

  try {
    await directStreamLlm(payload, infoBar, respEl, null);
    const { params, script } = extractResults(_lastAiContent || '');
    scriptEl.value = script;
    showParams(params);
    if (script) {
      infoBar.textContent = (infoBar.textContent || '').replace(' · ✓ 已自动保存', '') + ' · 脚本和参数已提取';
    } else {
      infoBar.textContent = (infoBar.textContent || '').replace(' · ✓ 已自动保存', '') + ' · ⚠️ 未检测到脚本，请检查 LLM 输出';
    }
  } catch (e) {
    infoBar.textContent = '直连失败，尝试后端代理...';
    try {
      await syncAiAnalysis(payload, infoBar, respEl, null);
      const { params, script } = extractResults(_lastAiContent || '');
      scriptEl.value = script;
      showParams(params);
    } catch (e2) {
      respEl.innerHTML = '<div class="error">生成失败：' + escape(e2.message) + '</div>';
    }
  } finally {
    if (btn) btn.disabled = false;
  }
}

function readCreateCredFields() {
  const mode = (document.querySelector('input[name="create-cred-mode"]:checked') || {}).value || '';
  if (!mode) return null;
  const cfg = { mode };
  if (mode === 'aksk' || mode === 'temp') {
    cfg.accessKeyId = ($('#cc-ak') || {}).value || '';
    cfg.secretAccessKey = ($('#cc-sk') || {}).value || '';
    if (mode === 'temp') cfg.sessionToken = ($('#cc-token') || {}).value || '';
  } else if (mode === 'role') {
    cfg.roleArn = ($('#cc-role') || {}).value || '';
  }
  return cfg;
}

}
function markFieldError(id, msg) {
  const f = $(id); if (!f) return;
  f.classList.add('field-error');
  const hint = el('div', { class: 'field-hint' }, msg);
  f.parentNode.insertBefore(hint, f.nextSibling);
}
function validateDuration(str) {
  if (!str) return false;
  str = str.trim();
  if (/^\d+$/.test(str)) return true;
  return /^(\d+\s*h)?(\d+\s*m(?!s))?(\d+\s*s)?$/.test(str) && parseDuration(str) > 0;
}

async function submitCreate() {
  const btn = $('#f-submit');
  btn.disabled = true;
  btn.textContent = '创建中...';
  clearFieldErrors();
  try {
    const testType = window._testType || 'simple';
    const name = $('#f-name').value.trim();
    if (!name) { markFieldError('#f-name', '请填写场景名称'); throw new Error('请填写场景名称'); }

    const region = $('#f-region').value;
    let taskCount, concurrency, rampUp, holdFor;
    if (testType === 'mcp') {
      taskCount = parseInt(($('#mcp-taskcount') || {}).value) || 1;
      concurrency = parseInt(($('#mcp-concurrency') || {}).value) || 10;
      rampUp = (($('#mcp-rampup') || {}).value || '30s').trim();
      holdFor = (($('#mcp-holdfor') || {}).value || '1m').trim();
      const mcpThroughput = ($('#mcp-throughput') || {}).value;
      if (mcpThroughput && parseFloat(mcpThroughput) > 0) window._mcpThroughput = parseFloat(mcpThroughput);
      else window._mcpThroughput = null;
    } else {
      taskCount = parseInt($('#f-taskcount').value);
      concurrency = parseInt($('#f-concurrency').value);
      rampUp = $('#f-rampup').value.trim();
      holdFor = $('#f-holdfor').value.trim();
    }

    if (!rampUp || !validateDuration(rampUp)) { markFieldError(testType === 'mcp' ? '#mcp-rampup' : '#f-rampup', '格式示例：30s、1m、2m30s'); throw new Error('爬升时间格式不正确'); }
    if (!holdFor || !validateDuration(holdFor)) { markFieldError(testType === 'mcp' ? '#mcp-holdfor' : '#f-holdfor', '格式示例：1m、5m、1h'); throw new Error('正式压测时长格式不正确'); }
    if (!(taskCount >= 1)) { markFieldError(testType === 'mcp' ? '#mcp-taskcount' : '#f-taskcount', '至少为 1'); throw new Error('容器数量至少为 1'); }
    if (!(concurrency >= 1)) { markFieldError(testType === 'mcp' ? '#mcp-concurrency' : '#f-concurrency', '至少为 1'); throw new Error('并发数至少为 1'); }

    const execEntry = { 'ramp-up': rampUp, 'hold-for': holdFor, scenario: 'scenario1' };
    const apiTestType = testType === 'mcp' ? 'jmeter' : testType;
    if (apiTestType !== 'simple') execEntry.executor = apiTestType;
    const tp = testType === 'mcp' ? window._mcpThroughput : parseFloat(($('#f-throughput') || {}).value);
    if (tp > 0) execEntry.throughput = tp;
    const testScenario = {
      execution: [execEntry],
      scenarios: { scenario1: {} }
    };

    if (testType === 'simple') {
      const url = $('#f-url').value.trim();
      if (!url) { markFieldError('#f-url', '请填写目标 URL'); throw new Error('请填写目标 URL'); }
      if (!/^https?:\/\/.+/i.test(url)) { markFieldError('#f-url', '需要以 http:// 或 https:// 开头'); throw new Error('URL 格式不正确'); }
      const method = $('#f-method').value;
      let headers = {};
      const hText = $('#f-headers').value.trim();
      if (hText) {
        try { headers = JSON.parse(hText); }
        catch { markFieldError('#f-headers', '请输入合法的 JSON 格式，如 {"Authorization":"Bearer xxx"}'); throw new Error('Headers 不是合法 JSON'); }
      }
      const body = $('#f-body').value;
      testScenario.scenarios.scenario1 = {
        requests: [{
          url, method, headers,
          body: body || undefined,
          'think-time': '0'
        }]
      };
    }
    // MCP mode: get generated script content as a Blob
    let mcpScriptBlob = null;
    let mcpPrompt = '';
    if (testType === 'mcp') {
      const scriptContent = ($('#f-generated-script') || {}).value || '';
      if (!scriptContent.trim()) throw new Error('请先生成 JMeter 脚本');
      mcpScriptBlob = new Blob([scriptContent], { type: 'application/xml' });
      mcpPrompt = ($('#f-prompt') || {}).value || '';
      // Extract target hostname from generated script
      const hm = scriptContent.match(/HTTPSampler\.domain">([^<]+)</);
      if (hm && hm[1].trim() !== 'example.com') testScenario.scriptTarget = hm[1].trim();
    }

    // 脚本类型：上传前提取目标 hostname 存入 testScenario.scriptTarget
    const scriptFile = (testType !== 'simple' && testType !== 'mcp') ? ($('#f-script') || {}).files[0] : null;
    if (scriptFile) {
      try {
        const txt = await scriptFile.text();
        let host = '';
        if (apiTestType === 'jmeter') {
          const m = txt.match(/HTTPSampler\.domain">([^<]+)</);
          if (m) host = m[1].trim();
        } else if (apiTestType === 'k6' || apiTestType === 'locust') {
          const m = txt.match(/https?:\/\/([^\s'"`\/]+)/);
          if (m) host = m[1];
        }
        if (host && host !== 'example.com') testScenario.scriptTarget = host;
      } catch {}
    }

    const detail = [
      ['场景名称', name],
      ['测试类型', apiTestType === 'simple' ? 'Simple HTTP' : apiTestType.toUpperCase()],
      ['容器数量 (Fargate)', taskCount],
      ['并发用户数 (每容器)', concurrency],
      ['爬升时间', rampUp],
      ['正式压测时长', holdFor],
    ];
    if (tp > 0) detail.push(['目标 RPS', taskCount > 1 ? (tp * taskCount) + '（每容器 ' + tp + '）' : tp]);
    if (!await showConfirm({
      title: '确认启动压测',
      message: '以下配置将启动 Fargate 容器执行压测：',
      detail,
      warn: '此操作会产生 AWS 费用（Fargate、网络传输等）。请确认参数正确。',
      confirmText: '确认运行',
    })) { btn.disabled = false; btn.textContent = '创建并运行'; return; }

    const payload = {
      testName: name,
      testDescription: $('#f-desc').value,
      testType: apiTestType,
      testTaskConfigs: [{ region, taskCount, concurrency }],
      testScenario,
      showLive: false,
      regionalTaskDetails: {
        [region]: { dltAvailableTasks: 1000 }
      }
    };

    const result = await api('POST', '/scenarios', payload);
    const _cred = readCreateCredFields();
    if (_cred) window._awsCred[result.testId] = _cred;

    // Upload script file (regular upload or MCP-generated blob)
    const fileToUpload = mcpScriptBlob || scriptFile;
    if (apiTestType !== 'simple' && fileToUpload) {
      try {
        const ext = mcpScriptBlob ? 'jmx' : (scriptFile.name.includes('.') ? scriptFile.name.split('.').pop() : '');
        if (!ext) throw new Error('文件缺少扩展名');
        showSuccess('场景已创建，正在上传脚本文件...');
        const urlResp = await api('GET', '/upload-url?testId=' + encodeURIComponent(result.testId) + '&fileExt=' + encodeURIComponent(ext) + '&testType=' + encodeURIComponent(apiTestType));
        const progDiv = $('#upload-progress');
        if (progDiv) progDiv.classList.remove('hidden');
        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('PUT', urlResp.uploadUrl, true);
          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              const pct = Math.round((e.loaded / e.total) * 100);
              const bar = $('#upload-bar'); if (bar) bar.style.width = pct + '%';
              const st = $('#upload-status'); if (st) st.textContent = pct + '% (' + (e.loaded / 1024 / 1024).toFixed(1) + ' MB)';
            }
          };
          xhr.onload = () => xhr.status >= 200 && xhr.status < 300 ? resolve() : reject(new Error('上传失败: HTTP ' + xhr.status));
          xhr.onerror = () => reject(new Error('上传失败: 网络错误'));
          xhr.send(fileToUpload);
        });
        showSuccess('脚本上传成功。Test ID: ' + result.testId);
        // Save MCP prompt to DynamoDB
        if (mcpPrompt) {
          api('PUT', '/scenarios/' + result.testId, { testPrompt: mcpPrompt }).catch(e => console.warn('Save testPrompt failed:', e));
        }
      } catch (uploadErr) {
        showError('脚本上传失败: ' + uploadErr.message + '。场景已创建(ID: ' + result.testId + ')，可用 CLI 手动上传。');
      }
    } else if (apiTestType !== 'simple') {
      showSuccess('创建成功。Test ID: ' + result.testId);
    } else {
      showSuccess('创建成功，测试已开始运行。Test ID: ' + result.testId);
    }
    setTimeout(() => route('detail', result.testId), 800);
  } catch (e) {
    showError(e.message);
    btn.disabled = false;
    btn.textContent = '创建并运行';
  }
}

// -------- Detail view --------
let _activeDetailId = null;
views.detail = async function (testId) {
  _activeDetailId = testId;
  const app = $('#app');
  app.innerHTML = '';
  app.appendChild(el('div', { id: 'detail-body' }, el('div', { class: 'loading' }, '加载中...')));

  let pollTimer = null;

  let _rendered = false;
  async function refresh() {
    if (_activeDetailId !== testId) return;
    try {
      const d = await api('GET', `/scenarios/${testId}`);
      if (_activeDetailId !== testId) return;
      const isRunning = d.status === 'running' || d.status === 'cancelling';
      if (_rendered && isRunning) {
        updateRunningDetail(d);
      } else {
        renderDetail(d);
        _rendered = true;
      }
      if (isRunning) pollTimer = setTimeout(refresh, 5000);
    } catch (e) {
      if (_activeDetailId !== testId) return;
      $('#detail-body').innerHTML = `<div class="error">${escape(e.message)}</div>`;
    }
  }

  window.addEventListener('hashchange', () => {
    if (pollTimer) clearTimeout(pollTimer);
  }, { once: true });

  refresh();
};

function _buildHeader(d) {
  return el('div', { class: 'card', id: 'dyn-header' },
    el('div', { style: 'display:flex;justify-content:space-between;align-items:center' },
      el('div', {},
        el('h2', {}, d.testName || d.testId),
        el('div', { class: 'muted' }, d.testDescription || '')
      ),
      el('div', {},
        el('span', { class: 'badge b-' + (d.status || 'idle') }, d.status || '-'),
        ' ',
        el('button', { onclick: () => route('list') }, '← 返回列表'),
        d.status === 'running' ?
          el('button', { class: 'danger', onclick: () => cancelTest(d.testId) }, '取消测试') :
          el('button', { class: 'primary', onclick: () => runAgain(d) }, '重新运行')
      )
    )
  );
}

// Filter tasks to current run only (exclude leftover STOPPED tasks from previous runs)
function _currentTasks(d) {
  if (!d.tasksPerRegion) return [];
  const all = d.tasksPerRegion.flatMap(r => r.tasks || []);
  const hasActive = all.some(t => t.lastStatus !== 'STOPPED');
  // If active tasks exist, hide STOPPED ones (they're from previous runs)
  return d.tasksPerRegion.map(region => ({
    ...region,
    tasks: (region.tasks || []).filter(t => hasActive ? t.lastStatus !== 'STOPPED' : true)
  })).filter(r => r.tasks.length > 0);
}

function _buildTasks(d) {
  if (d.status !== 'running') return null;
  const regions = _currentTasks(d);
  if (!regions.length) return null;
  return el('div', { class: 'card', id: 'dyn-tasks' },
    el('h2', {}, '正在运行的任务'),
    ...(regions.map(region => el('div', { style: 'margin-bottom:12px' },
      el('strong', {}, region.region), ' : ',
      el('span', {}, region.tasks.length + ' tasks'),
      el('div', { class: 'mono muted', style: 'font-size:11px' },
        region.tasks.slice(0,5).map(t => t.lastStatus + ' / ' + (t.containers[0] && t.containers[0].lastStatus)).join(' · ')
      )
    )))
  );
}

function _buildProgress(d) {
  if (d.status !== 'running') return null;
  const fmtDur = s => { const m = Math.floor(s / 60), sec = Math.floor(s % 60); return m > 0 ? m + 'm ' + sec + 's' : sec + 's'; };
  let totalExpectedSec = 0;
  try {
    const exec = d.testScenario && d.testScenario.execution && d.testScenario.execution[0];
    if (exec) totalExpectedSec = parseDuration(exec['ramp-up'] || '') + parseDuration(exec['hold-for'] || '');
  } catch {}
  if (totalExpectedSec > 0) totalExpectedSec += 120;

  let runningCount = 0, stoppedCount = 0, pendingCount = 0, deprovCount = 0, earliestStarted = null;
  const regions = _currentTasks(d);
  regions.forEach(r => r.tasks.forEach(t => {
    if (t.lastStatus === 'RUNNING') runningCount++;
    else if (t.lastStatus === 'STOPPED') stoppedCount++;
    else if (t.lastStatus === 'DEPROVISIONING') deprovCount++;
    else pendingCount++;
    if (t.startedAt) {
      const ts = new Date(t.startedAt).getTime();
      if (!isNaN(ts) && (!earliestStarted || ts < earliestStarted)) earliestStarted = ts;
    }
  }));
  const totalTasks = runningCount + stoppedCount + pendingCount + deprovCount;

  const phases = [
    { label: '启动 ECS 任务', done: false },
    { label: '执行压测', done: false },
    { label: '任务关闭', done: false },
    { label: '结果处理', done: false },
  ];
  let phaseIdx = 0, pct = 0, phaseDetail = '', barColor = '#ff9900', isPulse = false;

  if (totalTasks === 0) {
    phaseIdx = 0; isPulse = true;
    phaseDetail = 'Fargate 容器启动中，通常需要 30-60 秒...';
  } else if (runningCount > 0) {
    phaseIdx = 1; phases[0].done = true;
    if (totalExpectedSec > 0 && earliestStarted) {
      const elapsedSec = Math.max(0, (Date.now() - earliestStarted) / 1000);
      const totalWithOverhead = totalExpectedSec + 30;
      pct = Math.min(95, (elapsedSec / totalWithOverhead) * 100);
      const remaining = Math.max(0, totalExpectedSec - elapsedSec);
      phaseDetail = runningCount + ' 个任务执行中 · ' + fmtDur(elapsedSec) + ' / ' + fmtDur(totalExpectedSec)
        + (remaining > 0 ? ' · 预计剩余 ' + fmtDur(remaining) : ' · 即将完成');
    } else {
      pct = 30;
      phaseDetail = runningCount + ' 个任务执行中';
    }
  } else if ((stoppedCount > 0 || deprovCount > 0) && runningCount === 0) {
    phases[0].done = true; phases[1].done = true;
    if (earliestStarted && totalExpectedSec > 0) {
      const sinceStart = (Date.now() - earliestStarted) / 1000;
      if (sinceStart > totalExpectedSec + 60) {
        phaseIdx = 3; phases[2].done = true;
        pct = 98; barColor = '#2ca02c';
        phaseDetail = stoppedCount + ' 个任务已完成，解析结果并写入数据库...';
      } else {
        phaseIdx = 2; pct = 90;
        phaseDetail = stoppedCount + ' 个任务已结束，清理资源中...';
      }
    } else {
      phaseIdx = 2; pct = 90;
      phaseDetail = stoppedCount + ' 个任务已结束，等待结果...';
    }
  } else {
    phaseIdx = 0; isPulse = true;
    phaseDetail = pendingCount + ' 个任务等待调度中...';
  }

  const stepsDiv = el('div', { style: 'display:flex;gap:4px;margin-bottom:10px;font-size:12px' });
  phases.forEach((p, i) => {
    const isCurrent = (i === phaseIdx);
    const color = p.done ? '#2ca02c' : isCurrent ? '#ff9900' : '#c0c5cc';
    const icon = p.done ? '✓ ' : isCurrent ? '▶ ' : '';
    const weight = isCurrent ? '600' : '400';
    stepsDiv.appendChild(el('span', { style: 'color:' + color + ';font-weight:' + weight }, icon + p.label));
    if (i < phases.length - 1) stepsDiv.appendChild(el('span', { style: 'color:#c0c5cc' }, ' › '));
  });

  return el('div', { class: 'card', id: 'dyn-progress' },
    el('h2', {}, '运行进度'),
    stepsDiv,
    el('div', { style: 'height:8px;background:#e0e5eb;border-radius:4px;overflow:hidden;margin-bottom:8px' },
      isPulse
        ? el('div', { style: 'height:100%;width:30%;background:#ff9900;border-radius:4px;animation:pulse 1.5s ease-in-out infinite' })
        : el('div', { style: 'height:100%;width:' + pct.toFixed(1) + '%;background:' + barColor + ';border-radius:4px;transition:width 1s' })
    ),
    el('div', { class: 'muted' }, phaseDetail)
  );
}

function updateRunningDetail(d) {
  // Replace inner content only — the card container stays in DOM, no layout shift
  const oldH = $('#dyn-header');
  if (oldH) { const n = _buildHeader(d); oldH.replaceChildren(...n.childNodes); }
  const oldT = $('#dyn-tasks');
  const newT = _buildTasks(d);
  if (oldT && newT) oldT.replaceChildren(...newT.childNodes);
  else if (oldT && !newT) oldT.remove();
  else if (!oldT && newT) { const ref = $('#dyn-header'); if (ref) ref.after(newT); }
  const oldP = $('#dyn-progress');
  const newP = _buildProgress(d);
  if (oldP && newP) oldP.replaceChildren(...newP.childNodes);
  else if (!oldP && newP) { const body = $('#detail-body'); if (body) body.appendChild(newP); }
}

        scriptBody.innerHTML = '<div class="muted">加载脚本中...</div>';
